name: Design intelligence

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-design-intelligence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile design intelligence tools
        run: |
          python -m py_compile \
            scripts/score-design-selection.py \
            scripts/select-section-recipes.py \
            scripts/validate-anti-generic-visual.py \
            scripts/plan-vault-build.py \
            scripts/vault-build-orchestrator.py \
            scripts/ingest-business-source.py \
            scripts/vault-agent.py \
            scripts/select-3d-interaction-plan.py \
            scripts/select-heroui-components.py \
            scripts/select-component-intelligence.py \
            scripts/resolve-component-contract.py \
            scripts/run-design-critic.py \
            scripts/validate-business-understanding.py
      - name: Validate design intelligence JSON
        run: |
          python -m json.tool system/design-selection-scoring.json >/dev/null
          python -m json.tool system/section-recipes.json >/dev/null
          python -m json.tool quality/anti-generic-visual-rules.json >/dev/null
          python -m json.tool quality/VISUAL_QA_OBSERVATIONS.template.json >/dev/null
          python -m json.tool quality/DESIGN_CRITIC_OBSERVATIONS.template.json >/dev/null
          python -m json.tool benchmarks/component-benchmarks.json >/dev/null
          python -m json.tool research/business-source-report.schema.json >/dev/null
          python -m json.tool research/BUSINESS_SOURCE_REPORT.template.json >/dev/null
          python -m json.tool agent-runtime-index.json >/dev/null
          python -m json.tool prompts/prompt-index.json >/dev/null
          python -m json.tool 3d/interaction-intent-system.json >/dev/null
          python -m json.tool references/component-intelligence-index.json >/dev/null
          python -m json.tool references/heroui-v3/component-catalog.json >/dev/null
          python -m json.tool references/heroui-v3/hooks-catalog.json >/dev/null
          python -m json.tool references/heroui-v3/style-variant-catalog.json >/dev/null
          python -m json.tool references/heroui-v3/implementation-patterns.json >/dev/null
          python -m json.tool references/heroui-v3/storybook-testing-patterns.json >/dev/null
          python -m json.tool references/heroui-v3/component-state-contracts.json >/dev/null
          python -m json.tool references/heroui-v3/behavior-contracts.json >/dev/null
          python -m json.tool references/heroui-v3/source-snapshot.json >/dev/null
          python -m json.tool references/component-gallery/component-catalog.json >/dev/null
          python -m json.tool references/component-gallery/design-system-summary.json >/dev/null
          python -m json.tool references/component-gallery/contract-rules.json >/dev/null
          python -m json.tool references/component-gallery/comparative-patterns-wave1.json >/dev/null
          python -m json.tool references/component-gallery/comparative-wave2.json >/dev/null
      - name: Validate source ingestion routing
        run: |
          python - <<'PY'
          import json
          runtime=json.load(open('agent-runtime-index.json', encoding='utf-8'))
          prompts=json.load(open('prompts/prompt-index.json', encoding='utf-8'))
          assert 'sourceIngestion' in runtime['stages']
          assert runtime['entry']['businessSourceIngestion']=='scripts/ingest-business-source.py'
          ids={p['id'] for p in prompts['prompts']}
          assert 'business-source-ingestion' in ids
          source_prompt=next(p for p in prompts['prompts'] if p['id']=='business-source-ingestion')
          assert source_prompt['priority'] >= 130
          print('Validated business-source ingestion routing and progressive-disclosure entry points')
          PY
      - name: Validate section recipe inventory
        run: |
          python - <<'PY'
          import json
          data=json.load(open('system/section-recipes.json', encoding='utf-8'))
          recipes=data['recipes']
          assert len(recipes) == 40, f'expected 40 section recipes, got {len(recipes)}'
          sections={r['section'] for r in recipes}
          expected={'hero','proof','services','gallery','process','pricing','team','faq','cta','footer'}
          assert sections == expected, (sections, expected)
          ids=[r['id'] for r in recipes]
          assert len(ids) == len(set(ids)), 'duplicate section recipe ids'
          for r in recipes:
              assert r.get('composition') and r.get('requires') is not None and r.get('avoid') is not None
          print('Validated 40 section recipes across 10 section families')
          PY
      - name: Validate HeroUI reference inventory
        run: |
          python - <<'PY'
          import json
          data=json.load(open('references/heroui-v3/component-catalog.json', encoding='utf-8'))
          names=[name for values in data['categories'].values() for name in values]
          assert len(names) == 82, f'expected 82 HeroUI component families, got {len(names)}'
          assert len(names) == len(set(names)), 'duplicate HeroUI component ids'
          hooks=json.load(open('references/heroui-v3/hooks-catalog.json', encoding='utf-8'))
          assert hooks['hookCount'] == 10 and len(hooks['hooks']) == 10
          styles=json.load(open('references/heroui-v3/style-variant-catalog.json', encoding='utf-8'))
          assert styles['variantFamilyCount'] == 83 and len(styles['variantFamilies']) == 83
          snapshot=json.load(open('references/heroui-v3/source-snapshot.json', encoding='utf-8'))
          assert snapshot['captured']['totalIndexedItems'] == 175
          assert snapshot['captured']['derivedStateContracts'] == 25
          deeper=json.load(open('references/heroui-v3/storybook-testing-patterns.json', encoding='utf-8'))
          assert len(deeper['observedPatterns']) >= 3
          states=json.load(open('references/heroui-v3/component-state-contracts.json', encoding='utf-8'))
          assert len(states['contracts']) == 25
          behaviors=json.load(open('references/heroui-v3/behavior-contracts.json', encoding='utf-8'))
          assert len(behaviors['components']) >= 25
          print('Validated HeroUI primitives, state contracts, behavior contracts and deep testing patterns')
          PY
      - name: Validate Component Gallery inventory and contracts
        run: |
          python - <<'PY'
          import json
          data=json.load(open('references/component-gallery/component-catalog.json', encoding='utf-8'))
          items=data['components']
          assert len(items) == 60, f'expected 60 Component Gallery families, got {len(items)}'
          assert len({x['id'] for x in items}) == 60
          assert data['source']['designSystemCount'] == 95
          assert data['source']['exampleCount'] == 2671
          rules=json.load(open('references/component-gallery/contract-rules.json', encoding='utf-8'))
          assert len(rules['componentArchetypes']) == 60
          assert len(rules['criticalDistinctions']) >= 10
          wave1=json.load(open('references/component-gallery/comparative-patterns-wave1.json', encoding='utf-8'))
          wave2=json.load(open('references/component-gallery/comparative-wave2.json', encoding='utf-8'))
          assert len(wave1['components']) == 4
          assert len(wave2['components']) == 10
          print('Validated Component Gallery taxonomy and comparative research')
          PY
      - name: Validate component benchmark suite
        run: |
          python - <<'PY'
          import json
          data=json.load(open('benchmarks/component-benchmarks.json', encoding='utf-8'))
          benches=data['benchmarks']
          assert len(benches) == 10, len(benches)
          assert len({x['id'] for x in benches}) == 10
          for b in benches:
              assert len(b['requiredComponents']) >= 5, b['id']
              assert len(b['criticalStates']) >= 3, b['id']
              assert len(b['forbiddenSubstitutions']) >= 2, b['id']
              assert len(b['mobileExpectations']) >= 2, b['id']
          automotive=next(x for x in benches if x['id']=='b10-automotive-3d-configurator')
          assert automotive['required3D']['subjectClass']=='vehicle'
          print('Validated 10 realistic component benchmarks including subject-aware automotive 3D')
          PY
      - name: Validate 3D interaction intent inventory
        run: |
          python - <<'PY'
          import json
          system=json.load(open('3d/interaction-intent-system.json', encoding='utf-8'))
          classes=system['subjectClasses']
          assert len(classes) >= 7
          ids=[x['id'] for x in classes]
          assert len(ids) == len(set(ids)), 'duplicate 3D subject class ids'
          for item in classes:
              assert item.get('businessSignals'), item['id']
              assert item.get('validGoals'), item['id']
              assert item.get('allowedInteractions'), item['id']
              assert item.get('requirements'), item['id']
              assert item.get('reject'), item['id']
          print(f'Validated {len(classes)} subject-aware 3D interaction classes')
          PY
      - name: Run design intelligence tests
        run: |
          python -m unittest \
            tests.test_agent_usability \
            tests.test_business_source_ingestion \
            tests.test_design_selection_engine \
            tests.test_anti_generic_visual_gate \
            tests.test_3d_interaction_intent \
            tests.test_heroui_reference \
            tests.test_component_gallery_reference \
            tests.test_component_contracts \
            tests.test_component_gallery_wave2 \
            tests.test_component_benchmarks_and_critic -v
