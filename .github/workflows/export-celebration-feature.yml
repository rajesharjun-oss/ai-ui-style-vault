name: Export celebration feature snapshot

on:
  push:
    branches:
      - feat/celebration-event-microsite-pack
    paths:
      - .github/workflows/export-celebration-feature.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/celebration-event-microsite-pack
          fetch-depth: 0
      - name: Create clean snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/celebration-feature
          rsync -a --exclude='.git' ./ /tmp/celebration-feature/
      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: celebration-feature-snapshot
          path: /tmp/celebration-feature
          include-hidden-files: true
          retention-days: 1
      - name: Remove export workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/export-celebration-feature.yml
          git commit -m "Remove temporary celebration snapshot workflow"
          git push origin HEAD:feat/celebration-event-microsite-pack
