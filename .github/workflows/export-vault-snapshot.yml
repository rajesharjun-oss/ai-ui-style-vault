name: Export vault snapshot

on:
  push:
    branches:
      - tmp/study-eazylife-site

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove Git metadata
        run: rm -rf .git
      - name: Upload repository snapshot
        uses: actions/upload-artifact@v4
        with:
          name: ai-ui-style-vault-main-snapshot
          path: .
          include-hidden-files: true
          retention-days: 1
