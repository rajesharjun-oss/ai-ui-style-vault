name: Materialize 3D pack v2

on:
  push:
    branches:
      - feat/3d-immersive-web-pack
    paths:
      - .github/workflows/materialize-3d-pack-v2.yml

permissions:
  contents: write
  actions: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/3d-immersive-web-pack
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Re-run generator and hardened relevance materializer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          def heredocs(path):
              text = Path(path).read_text(encoding='utf-8')
              marker = "          python - <<'PY'\n"
              end_marker = "\n          PY\n"
              result = []
              cursor = 0
              while True:
                  try:
                      start = text.index(marker, cursor) + len(marker)
                      end = text.index(end_marker, start)
                  except ValueError:
                      break
                  result.append(textwrap.dedent(text[start:end]))
                  cursor = end + len(end_marker)
              return result

          # Generate the base 3D pack from the original one-shot generator.
          base_blocks = heredocs('.github/workflows/generate-3d-immersive-pack.yml')
          if not base_blocks:
              raise RuntimeError('Could not find 3D generator Python block')
          code = base_blocks[0]
          code = code.replace(
              'if json_marker not in quality: raise RuntimeError("Quality JSON marker missing")',
              'if json_marker not in quality: json_marker = ""',
          )
          code = code.replace(
              'if validator_marker not in quality: raise RuntimeError("Quality validator marker missing")',
              'if validator_marker not in quality: validator_marker = ""',
          )
          exec(compile(code, 'materialized-3d-generator.py', 'exec'), {'__name__':'__main__'})

          # Reuse the semantic relevance materializer, but replace its permissive
          # substring matcher with meaningful whole-word matching and deny-first logic.
          semantic_blocks = heredocs('.github/workflows/materialize-3d-pack.yml')
          if len(semantic_blocks) < 2:
              raise RuntimeError('Could not find semantic relevance Python block')
          semantic = semantic_blocks[1]
          old = '''              approved = any(any(token in item for token in _norm(value).split()) for value in domain["approvedSubjects"])
              rejected = any(any(token in item for token in _norm(value).split()) for value in domain["rejectExamples"])
              if rejected and not approved:
                  return {"decision":"reject","score":0,"domain":domain["id"],"reason":"Subject matches an explicit unrelated example for this domain."}
              if approved:
                  return {"decision":"candidate","score":4,"domain":domain["id"],"reason":"Subject matches the domain visual vocabulary; verify exact business/page evidence before approval."}
'''
          new = '''              stop = {"a","an","and","as","at","by","for","from","in","into","of","on","or","the","to","with","actual","random","unrelated","verified","generic"}
              item_words = set(item.split())
              def meaningful_terms(value: str) -> set[str]:
                  return {word for word in _norm(value).split() if word not in stop and len(word) >= 3}
              def matches(values: list[str]) -> bool:
                  for value in values:
                      terms = meaningful_terms(value)
                      if terms and (terms <= item_words or bool(terms & item_words)):
                          return True
                  return False
              # Explicit exclusions win. An attractive forbidden object cannot be
              # rescued by coincidental overlap with a broad approved phrase.
              rejected = matches(domain["rejectExamples"])
              if rejected:
                  return {"decision":"reject","score":0,"domain":domain["id"],"reason":"Subject matches an explicit unrelated example for this domain."}
              approved = matches(domain["approvedSubjects"])
              if approved:
                  return {"decision":"candidate","score":4,"domain":domain["id"],"reason":"Subject matches the domain visual vocabulary; verify exact business/page evidence before approval."}
'''
          if old not in semantic:
              raise RuntimeError('Expected semantic matcher block was not found')
          semantic = semantic.replace(old, new, 1)

          # Add a scene-level helper: every primary layer must independently pass.
          old_tail = '''              return {"decision":"manual-review","score":2,"domain":domain["id"],"reason":"No direct domain match; do not use as a primary visual without specific verified justification."}
          '' '
          # Avoid fragile exact replacement: append helper inside generated source text.
          helper_anchor = "          ''')\n\n          pack_path = PACK / 'pack.json'"
          helper_code = '''

          def scene_relevance(brief: str, layers: dict[str, str]) -> dict:
              results = {name: subject_relevance(brief, subject) for name, subject in layers.items()}
              rejected = [name for name, result in results.items() if result.get("decision") == "reject"]
              weak = [name for name, result in results.items() if result.get("decision") == "manual-review"]
              if rejected:
                  return {"decision":"reject","score":0,"rejectedLayers":rejected,"layers":results}
              if weak:
                  return {"decision":"manual-review","score":2,"weakLayers":weak,"layers":results}
              return {"decision":"candidate","score":4,"layers":results}
'''
          if helper_anchor not in semantic:
              raise RuntimeError('Could not locate semantic source closing anchor')
          semantic = semantic.replace("          ''')\n\n          pack_path = PACK / 'pack.json'", helper_code + "          ''')\n\n          pack_path = PACK / 'pack.json'", 1)

          # Add scene-level tests to the generated test module.
          test_anchor = '''              def test_pack_requires_relevance_contract(self):
'''
          scene_tests = '''              def test_pizza_rejects_unrelated_showroom_background(self):
                  result = semantic.scene_relevance("pizza restaurant food delivery", {"product":"pepperoni pizza", "environment":"luxury sports car showroom"})
                  self.assertEqual(result["decision"], "reject")
                  self.assertIn("environment", result["rejectedLayers"])

              def test_pizza_scene_accepts_food_context(self):
                  result = semantic.scene_relevance("pizza restaurant food delivery", {"product":"pepperoni pizza", "environment":"restaurant interior", "prop":"pizza oven"})
                  self.assertEqual(result["decision"], "candidate")

'''
          if test_anchor not in semantic:
              raise RuntimeError('Could not locate semantic test anchor')
          semantic = semantic.replace(test_anchor, scene_tests + test_anchor, 1)
          exec(compile(semantic, 'semantic-relevance-materializer.py', 'exec'), {'__name__':'__main__'})
          PY

      - name: Validate pack and semantic relevance gate
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/validate-3d-immersive-pack.py scripts/select-3d-references.py packs/3d-immersive-web/code/semantic-relevance.py
          python scripts/validate-domain-packs.py
          python scripts/validate-celebration-pack.py
          python scripts/validate-3d-immersive-pack.py
          python -m unittest discover -s tests -p 'test_*.py' -v
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          p = Path('packs/3d-immersive-web/code/semantic-relevance.py')
          spec = importlib.util.spec_from_file_location('rel', p)
          m = importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          assert m.subject_relevance('pizza restaurant food delivery', 'red Ferrari sports car')['decision'] == 'reject'
          assert m.subject_relevance('pizza restaurant food delivery', 'pepperoni pizza and oven')['decision'] == 'candidate'
          assert m.subject_relevance('tax accounting consulting firm', 'luxury sports car')['decision'] == 'reject'
          assert m.scene_relevance('pizza restaurant food delivery', {'product':'pepperoni pizza','environment':'luxury sports car showroom'})['decision'] == 'reject'
          assert m.scene_relevance('pizza restaurant food delivery', {'product':'pepperoni pizza','environment':'restaurant interior','prop':'pizza oven'})['decision'] == 'candidate'
          print('SEMANTIC_RELEVANCE_HARD_GATE=PASS')
          PY

      - name: Commit materialized pack and remove generator scaffolding
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f --ignore-unmatch \
            .github/workflows/generate-3d-immersive-pack.yml \
            .github/workflows/extend-3d-reference-pipeline.yml \
            .github/workflows/verify-3d-immersive-pack.yml \
            .github/workflows/materialize-3d-pack.yml \
            .github/workflows/materialize-3d-pack-v2.yml
          git add -- AGENTS.md CLAUDE.md GEMINI.md PACKS.md PROMPTS.md README.md agent-index.json prompts packs 3d scripts tests .github/workflows/quality.yml
          git commit -m 'Materialize 3D immersive pack with strict semantic relevance'
          git push origin HEAD:feat/3d-immersive-web-pack
