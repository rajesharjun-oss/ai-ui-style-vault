name: Clean celebration feature branch

on:
  push:
    branches:
      - feat/celebration-event-microsite-pack
    paths:
      - .github/workflows/cleanup-celebration-branch.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/celebration-event-microsite-pack
          fetch-depth: 0
      - name: Remove temporary patch payload and cleanup workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch .github/tmp/celebration-pack/part-00
          git rm -f .github/workflows/cleanup-celebration-branch.yml
          git commit -m "Remove temporary celebration patch payload"
          git push origin HEAD:feat/celebration-event-microsite-pack
