          json_marker = "          python -m json.tool packs/celebration-event-microsite/templates/design-recipe.example.json >/dev/null\n"
          if json_marker not in quality: raise RuntimeError("Quality JSON marker missing")
          extra_json = '''          python -m json.tool packs/3d-immersive-web/pack.json >/dev/null\n          python -m json.tool packs/3d-immersive-web/style-families.json >/dev/null\n          python -m json.tool packs/3d-immersive-web/production-themes.json >/dev/null\n          python -m json.tool packs/3d-immersive-web/page-blueprints.json >/dev/null\n          python -m json.tool packs/3d-immersive-web/component-manifest.json >/dev/null\n          python -m json.tool packs/3d-immersive-web/interaction-patterns.json >/dev/null\n          python -m json.tool packs/3d-immersive-web/state-vocabulary.json >/dev/null\n          python -m json.tool packs/3d-immersive-web/performance-budgets.json >/dev/null\n          python -m json.tool packs/3d-immersive-web/sample-data/immersive-product.sample.json >/dev/null\n          python -m json.tool packs/3d-immersive-web/schemas/immersive-experience.schema.json >/dev/null\n          python -m json.tool packs/3d-immersive-web/schemas/scene-asset.schema.json >/dev/null\n          python -m json.tool packs/3d-immersive-web/templates/design-recipe.example.json >/dev/null\n          python -m json.tool 3d/source-catalog.json >/dev/null\n          python -m json.tool 3d/techniques/technique-catalog.json >/dev/null\n          python -m json.tool 3d/references/refs-gallery-3d.json >/dev/null\n          python -m json.tool 3d/references/refs-gallery-collection-summary.json >/dev/null\n'''
          quality = quality.replace(json_marker, json_marker + extra_json, 1)
          validator_marker = "      - name: Validate Celebration & Event Microsite pack\n        run: python scripts/validate-celebration-pack.py\n"
          if validator_marker not in quality: raise RuntimeError("Quality validator marker missing")
          quality = quality.replace(validator_marker, validator_marker + "      - name: Validate 3D & Immersive Web pack\n        run: python scripts/validate-3d-immersive-pack.py\n", 1)
          quality_path.write_text(quality, encoding="utf-8")
          PY

      - name: Validate generated pack
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/validate-content-design.py \
            scripts/initialize-vault-project.py \
            scripts/validate-domain-packs.py \
            scripts/validate-celebration-pack.py \
            scripts/validate-3d-immersive-pack.py \
            scripts/select-3d-references.py
          python -m unittest discover -s tests -p 'test_*.py' -v
          python scripts/validate-domain-packs.py
          python scripts/validate-celebration-pack.py
          python scripts/validate-3d-immersive-pack.py
          python scripts/select-3d-references.py \
            'premium product configurator with material swatches' \
            --style-family product-configurator \
            --limit 5 >/tmp/3d-selection.json
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('.').rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
          selection = json.loads(Path('/tmp/3d-selection.json').read_text())
          assert selection['count'] > 0
          PY

      - name: Commit generated pack and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/generate-3d-immersive-pack.yml
          git add -- \
            AGENTS.md CLAUDE.md GEMINI.md PACKS.md PROMPTS.md README.md agent-index.json \
            .github/workflows/quality.yml \
            packs/pack-index.json prompts/prompt-index.json \
            packs/3d-immersive-web 3d \
            prompts/BUILD_3D_IMMERSIVE_WEB_EXPERIENCE.md \
            scripts/select-3d-references.py scripts/validate-3d-immersive-pack.py \
            tests/test_3d_immersive_web_pack.py \
            .github/workflows/generate-3d-immersive-pack.yml
          git commit -m 'Add 3D and Immersive Web capability pack'
          git push origin HEAD:feat/3d-immersive-web-pack
