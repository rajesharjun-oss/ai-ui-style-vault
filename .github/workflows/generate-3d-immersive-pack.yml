          write_text("packs/3d-immersive-web/code/capability-tiers.ts", r'''
          export type ExperienceTier = "static" | "basic-mobile" | "balanced" | "high";
          export interface CapabilitySignals { webgl: boolean; webgl2: boolean; webgpu: boolean; reducedMotion: boolean; saveData: boolean; deviceMemoryGB?: number; hardwareConcurrency?: number; width: number; pointer: "coarse" | "fine" | "unknown"; }
          export function chooseInitialTier(s: CapabilitySignals): ExperienceTier {
            if (!s.webgl || s.saveData) return "static";
            const mobile = s.pointer === "coarse" || s.width < 768;
            if (mobile && ((s.deviceMemoryGB ?? 4) <= 4 || (s.hardwareConcurrency ?? 4) <= 4)) return "basic-mobile";
            if (!mobile && s.webgl2 && (s.deviceMemoryGB ?? 8) >= 8 && (s.hardwareConcurrency ?? 8) >= 8 && !s.reducedMotion) return "high";
            return mobile ? "basic-mobile" : "balanced";
          }
          // Use a trusted server for protected content, price, availability and permissions; client tiers are progressive-enhancement hints only.
          ''')
          write_text("packs/3d-immersive-web/code/scene-budget.ts", r'''
          export interface SceneMetrics { transferBytes: number; visibleTriangles: number; drawCalls: number; maxTextureDimension: number; estimatedGpuMemoryMB: number; averageFrameTimeMs?: number; }
          export interface SceneBudget { totalSceneTransferMax: number; visibleTrianglesMax: number; drawCallsMax: number; maxTextureDimension: number; estimatedGpuMemoryMBMax: number; targetFps: number; }
          export function exceedsBudget(m: SceneMetrics, b: SceneBudget): string[] {
            const errors: string[] = [];
            if (m.transferBytes > b.totalSceneTransferMax) errors.push("transferBytes");
            if (m.visibleTriangles > b.visibleTrianglesMax) errors.push("visibleTriangles");
            if (m.drawCalls > b.drawCallsMax) errors.push("drawCalls");
            if (m.maxTextureDimension > b.maxTextureDimension) errors.push("maxTextureDimension");
            if (m.estimatedGpuMemoryMB > b.estimatedGpuMemoryMBMax) errors.push("estimatedGpuMemoryMB");
            if (m.averageFrameTimeMs && 1000 / m.averageFrameTimeMs < b.targetFps) errors.push("targetFps");
            return errors;
          }
          ''')
