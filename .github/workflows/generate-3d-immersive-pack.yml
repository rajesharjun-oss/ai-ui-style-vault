name: Generate 3D immersive web pack

on:
  push:
    branches:
      - feat/3d-immersive-web-pack
    paths:
      - .github/workflows/generate-3d-immersive-pack.yml

permissions:
  contents: write
  actions: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/3d-immersive-web-pack
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download collected Refs.Gallery metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9251402447/zip" \
            -o /tmp/refs-gallery-3d.zip || true
          mkdir -p /tmp/refs-gallery-3d
          if test -s /tmp/refs-gallery-3d.zip; then
            unzip -q /tmp/refs-gallery-3d.zip -d /tmp/refs-gallery-3d || true
          fi

      - name: Generate pack, catalogues, routing, validation and tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import textwrap
          from pathlib import Path

          ROOT = Path.cwd()
          PACK = ROOT / "packs" / "3d-immersive-web"
          REF = ROOT / "3d"
          for path in [
              PACK / "templates",
              PACK / "schemas",
              PACK / "sample-data",
              PACK / "code",
              REF / "references",
              REF / "techniques",
              REF / "assets",
          ]:
              path.mkdir(parents=True, exist_ok=True)

          def write_text(relative: str, value: str) -> None:
              path = ROOT / relative
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(textwrap.dedent(value).lstrip(), encoding="utf-8")

          def write_json(relative: str, value) -> None:
              path = ROOT / relative
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(json.dumps(value, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")

          # -----------------------------------------------------------------
          # Refs.Gallery: metadata and links only. No source media or code.
          # -----------------------------------------------------------------
          raw_payloads = []
          for path in Path("/tmp/refs-gallery-3d").rglob("*.json"):
              try:
                  raw_payloads.append(json.loads(path.read_text(encoding="utf-8", errors="replace")))
              except Exception:
                  pass

          raw_refs = []
          retrieved_at = "2026-08-15T00:00:00Z"
          for payload in raw_payloads:
              if isinstance(payload, dict):
                  if payload.get("retrievedAt"):
                      retrieved_at = str(payload["retrievedAt"])
                  for key in ("references", "projects", "items", "results"):
                      if isinstance(payload.get(key), list):
                          raw_refs.extend(payload[key])

          project_urls = set()
          for path in Path("/tmp/refs-gallery-3d").rglob("*"):
              if not path.is_file():
                  continue
              try:
                  text = path.read_text(encoding="utf-8", errors="ignore")
              except Exception:
                  continue
              project_urls.update(re.findall(r"https://refs\\.gallery/projects/[A-Za-z0-9._~:/?#\\[\\]@!$&'()*+,;=%-]+", text))
              project_urls.update("https://refs.gallery" + match for match in re.findall(r"(/projects/[A-Za-z0-9._~/?#%&=+-]+)", text))

          def slug(url: str) -> str:
              return url.rstrip("/.,);]").split("/")[-1] or hashlib.sha1(url.encode()).hexdigest()[:12]

          references = {}
          for item in raw_refs:
              if isinstance(item, str):
                  item = {"projectPage": item}
              if not isinstance(item, dict):
                  continue
              url = item.get("projectPage") or item.get("url") or item.get("href")
              if not url:
                  continue
              if str(url).startswith("/"):
                  url = "https://refs.gallery" + str(url)
              if "/projects/" not in str(url):
                  continue
              rid = str(item.get("id") or slug(str(url)))
              references[rid] = {
                  "id": rid,
                  "title": str(item.get("title") or rid.replace("-", " ").title()),
                  "projectPage": str(url).rstrip(".,);]"),
                  "liveUrl": str(item.get("liveUrl") or item.get("live_url") or ""),
                  "tags": sorted(set(str(value) for value in (item.get("tags") or []) if value)),
                  "description": str(item.get("description") or ""),
                  "publishedText": str(item.get("publishedText") or item.get("published") or ""),
              }
          for url in project_urls:
              rid = slug(url)
              references.setdefault(rid, {
                  "id": rid,
                  "title": rid.replace("-", " ").title(),
                  "projectPage": url.rstrip(".,);]"),
                  "liveUrl": "",
                  "tags": [],
                  "description": "",
                  "publishedText": "",
              })

          family_keywords = {
              "product-configurator": ["configurator", "customizer", "customiser", "variant"],
              "photoreal-product-reveal": ["product", "car", "watch", "phone", "shoe", "furniture", "bottle"],
              "scroll-driven-camera-journey": ["scroll", "story", "journey", "campaign"],
              "walkable-spatial-portfolio": ["portfolio", "studio", "agency", "world", "room"],
              "3d-typography": ["typography", "type", "letter", "font"],
              "glass-refraction": ["glass", "refraction", "crystal", "lens"],
              "liquid-organic-shaders": ["liquid", "fluid", "organic", "shader", "water"],
              "particles-nebulae": ["particle", "space", "nebula", "star", "galaxy"],
              "architectural-digital-twin": ["architecture", "real estate", "building", "interior", "museum"],
              "interactive-globe-map": ["globe", "map", "earth", "location"],
              "character-led-experience": ["character", "avatar", "mascot"],
              "low-poly-world": ["low poly", "low-poly", "isometric", "game"],
              "portal-navigation": ["portal"],
              "holographic-cyber-interface": ["holographic", "cyber", "futuristic", "sci-fi"],
          }
          for item in references.values():
              hay = " ".join([item["title"], item["description"], " ".join(item["tags"])]).lower()
              family = "mixed-dom-webgl"
              for candidate, keywords in family_keywords.items():
                  if any(keyword in hay for keyword in keywords):
                      family = candidate
                      break
              item.update({
                  "sourceType": "reference-gallery",
                  "usagePolicy": "reference-only",
                  "styleFamily": family,
                  "performanceRisk": "high" if family in {"scroll-driven-camera-journey", "architectural-digital-twin", "liquid-organic-shaders"} else "medium",
                  "copyPolicy": "Do not copy media, code, text, branding, models or exact layouts.",
              })

          refs_payload = {
              "source": "Refs.Gallery",
              "sourceUrl": "https://refs.gallery/category/3d",
              "retrievedAt": retrieved_at,
              "usage": "Public metadata and links for reference selection only. No source media or code is stored.",
              "collectionMethod": "Conservative public category/project metadata collection. Individual project licences and availability must be rechecked before use.",
              "total": len(references),
              "references": sorted(references.values(), key=lambda item: (item["title"].lower(), item["id"])),
          }
          write_json("3d/references/refs-gallery-3d.json", refs_payload)
          write_json("3d/references/refs-gallery-collection-summary.json", {
              "sourceUrl": refs_payload["sourceUrl"],
              "retrievedAt": retrieved_at,
              "referenceCount": refs_payload["total"],
              "withLiveUrl": sum(bool(item["liveUrl"]) for item in refs_payload["references"]),
              "withTags": sum(bool(item["tags"]) for item in refs_payload["references"]),
              "styleFamilyCounts": {
                  family: sum(item["styleFamily"] == family for item in refs_payload["references"])
                  for family in sorted(set(item["styleFamily"] for item in refs_payload["references"]))
              },
              "limitations": [
                  "The catalogue stores links and metadata only.",
                  "Dynamic pagination and source-site changes may affect completeness.",
                  "A reference listing does not grant reuse rights.",
                  "Review the live project and current terms before using any technique or asset.",
              ],
          })

          # -----------------------------------------------------------------
          # Style families and production themes.
          # -----------------------------------------------------------------
          family_rows = [
              ("minimal-3d-object-hero", "Minimal 3D Object Hero", "SaaS, hardware, single-product launches", "low-to-medium", "Responsive still image"),
              ("photoreal-product-reveal", "Photoreal Product Reveal", "Electronics, automotive, beauty, luxury products", "high", "Product photography or rendered video"),
              ("product-configurator", "Product Configurator", "Furniture, vehicles, equipment, custom products", "medium-to-high", "Variant photography and standard product form"),
              ("low-poly-world", "Low-Poly World", "Education, games, playful campaigns", "medium", "Illustrated map or chapter experience"),
              ("clay-soft-toy-3d", "Clay or Soft-Toy 3D", "Friendly consumer brands and onboarding", "low-to-medium", "2D render or Rive"),
              ("isometric-diorama", "Isometric Diorama", "Property, logistics, process explanation", "medium", "Accessible isometric diagram"),
              ("walkable-spatial-portfolio", "Walkable Spatial Portfolio", "Studios, artists, game developers", "high", "Conventional portfolio index"),
              ("scroll-driven-camera-journey", "Scroll-Driven Camera Journey", "Product launches, brand stories, editorial", "high", "DOM chapters with stills or video"),
              ("3d-typography", "3D Typography", "Fashion, music, entertainment", "medium", "Equivalent DOM heading"),
              ("glass-refraction", "Glass and Refraction", "Luxury technology and beauty", "high", "Static glass render"),
              ("liquid-organic-shaders", "Liquid and Organic Shaders", "Beauty, wellness, music, art", "high", "Compressed loop or still"),
              ("particles-nebulae", "Particles and Nebulae", "AI, science, space and data", "medium-to-high", "Video or SVG/canvas field"),
              ("holographic-cyber-interface", "Holographic or Cyber Interface", "Gaming, security and future technology", "medium-to-high", "Accessible dark DOM UI"),
              ("architectural-digital-twin", "Architectural Digital Twin", "Real estate, factories, infrastructure", "very-high", "Plans, photos, maps and tables"),
              ("interactive-globe-map", "Interactive Globe or Map", "Logistics, travel and global networks", "medium-to-high", "Accessible list and 2D map"),
              ("character-led-experience", "Character-Led Experience", "Education, onboarding and storytelling", "medium", "Illustration or Rive"),
              ("portal-navigation", "Portal Navigation", "Portfolios, exhibitions and entertainment", "high", "Standard chapter navigation"),
              ("2d-to-3d-transition", "2D-to-3D Transition", "Editorial portfolios and campaigns", "medium-to-high", "Ordinary page transition"),
              ("physics-based-interaction", "Physics-Based Interaction", "Games, promotions and playful tools", "high", "Direct or scripted interaction"),
              ("mixed-dom-webgl", "Mixed DOM and WebGL", "Commercial and content-led websites", "medium", "Complete 2D website"),
              ("ar-webxr", "AR or WebXR Experience", "Products, museums, property and education", "high", "Standard viewer, photos and measurements"),
          ]
          families = [{
              "id": identifier,
              "name": name,
              "bestFor": [value.strip() for value in best.split(",")],
              "visualTraits": ["purpose-led spatial composition", "semantic DOM content", "controlled art direction"],
              "typicalInteractions": ["guided focus", "direct reset", "capability-aware enhancement"],
              "preferredImplementation": ["Use the smallest medium that fulfils the task"],
              "performanceRisk": risk,
              "mobileStrategy": "DOM-first with reduced assets and guided interaction",
              "fallback": fallback,
          } for identifier, name, best, risk, fallback in family_rows]
          write_json("packs/3d-immersive-web/style-families.json", {
              "name": "3D & Immersive Web Style Families",
              "version": "1.0.0",
              "selectionRule": "Choose a family only when depth, spatial interaction or real-time visualisation materially improves understanding, confidence or storytelling.",
              "families": families,
          })

          theme_rows = [
              ("product-studio", ["minimal-3d-object-hero", "photoreal-product-reveal", "product-configurator"], "precise, premium, material-aware"),
              ("cinematic-product-story", ["scroll-driven-camera-journey", "photoreal-product-reveal", "2d-to-3d-transition"], "cinematic, focused, editorial"),
              ("spatial-creative", ["walkable-spatial-portfolio", "portal-navigation", "3d-typography"], "expressive, experimental, crafted"),
              ("playful-world", ["low-poly-world", "clay-soft-toy-3d", "character-led-experience"], "friendly, energetic, clear"),
              ("technical-holographic", ["holographic-cyber-interface", "particles-nebulae", "interactive-globe-map"], "technical, credible, controlled"),
              ("architectural-explorer", ["architectural-digital-twin", "isometric-diorama", "interactive-globe-map"], "accurate, calm, spatial"),
              ("organic-sensory", ["liquid-organic-shaders", "glass-refraction", "particles-nebulae"], "sensory, fluid, atmospheric"),
              ("xr-preview", ["ar-webxr", "product-configurator", "architectural-digital-twin"], "practical, clear, capability-aware"),
          ]
          write_json("packs/3d-immersive-web/production-themes.json", {
              "name": "3D & Immersive Web Production Themes",
              "version": "1.0.0",
              "themes": [{
                  "id": identifier,
                  "name": identifier.replace("-", " ").title(),
                  "styleFamilies": family_ids,
                  "tone": [value.strip() for value in tone.split(",")],
                  "contentDensity": "balanced",
                  "domRole": "Essential content, controls and transactions remain semantic DOM.",
                  "fallback": "Complete static or 2D experience.",
                  "avoid": ["spectacle without purpose", "canvas-only controls", "unmeasured performance"],
              } for identifier, family_ids, tone in theme_rows],
          })

          # -----------------------------------------------------------------
          # Blueprints, components, interactions, states and budgets.
          # -----------------------------------------------------------------
          blueprint_rows = [
              ("mixed-dom-webgl-marketing", "Use a shared stage to strengthen a readable commercial site."),
              ("minimal-3d-hero", "Present one meaningful object while identification and action remain immediate."),
              ("cinematic-product-launch", "Explain a flagship product through authored camera chapters and real evidence."),
              ("3d-product-configurator", "Inspect and configure a product while price, status and purchase controls remain explicit."),
              ("spatial-portfolio", "Organise creative work spatially while preserving a normal project index and deep links."),
              ("scroll-camera-story", "Synchronise semantic story chapters with a continuous scene."),
              ("interactive-showroom", "Explore curated products, rooms or exhibits through guided stations."),
              ("digital-twin-explorer", "Inspect facilities, machines or infrastructure with accurate zones and data overlays."),
              ("3d-data-globe", "Show verified locations and routes with search, filters and an accessible list."),
              ("character-led-experience", "Use a character to guide onboarding, education or storytelling through explicit states."),
              ("webxr-ar-preview", "Offer opt-in AR/XR after compatibility, scale and fallback are clear."),
          ]
          write_json("packs/3d-immersive-web/page-blueprints.json", {
              "name": "3D & Immersive Web Page Blueprints",
              "version": "1.0.0",
              "instructions": "Select the smallest blueprint that solves the task and combine it with the matching product-domain pack.",
              "blueprints": [{
                  "id": identifier,
                  "purpose": purpose,
                  "requiredBlocks": ["semantic DOM shell", "3D purpose", "capability gate", "scene or viewer", "designed fallback", "primary action"],
                  "optionalBlocks": ["hotspots", "quality selector", "camera presets", "AR/XR"],
                  "primaryStates": ["loading-shell", "loading-scene", "interactive", "reduced-motion", "low-power", "scene-error", "fallback-static", "mobile"],
                  "desktopComposition": "Canvas and DOM use a stable authored composition.",
                  "mobileTransformation": "DOM-first, fewer assets/effects and guided touch interaction.",
                  "antiPatterns": ["canvas-only website", "unbounded camera", "no fallback", "hidden primary action"],
                  "acceptanceCriteria": ["The primary task works without 3D.", "Essential content and controls remain semantic DOM.", "Performance and fallback evidence exists."],
              } for identifier, purpose in blueprint_rows],
          })

          component_rows = [
              ("immersive-app-shell", "structure"), ("canvas-stage", "rendering"), ("scene-loader", "loading"),
              ("loading-progress", "feedback"), ("capability-gate", "progressive-enhancement"), ("fallback-render", "fallback"),
              ("camera-rig", "navigation"), ("scroll-camera-controller", "navigation"), ("orbit-controller", "navigation"),
              ("focus-target", "navigation"), ("hotspot-annotation", "annotation"), ("model-viewer", "product"),
              ("product-configurator", "commerce"), ("variant-selector", "commerce"), ("material-swatch", "commerce"),
              ("environment-switcher", "rendering"), ("quality-selector", "performance"), ("performance-monitor", "performance"),
              ("scene-error-state", "feedback"), ("fullscreen-toggle", "controls"), ("audio-toggle", "controls"),
              ("dom-overlay", "accessibility"), ("spatial-navigation", "navigation"), ("portal-transition", "navigation"),
              ("model-credit", "licensing"), ("ar-launcher", "xr"), ("asset-preload-manager", "loading"),
              ("animation-timeline-controller", "motion"), ("context-loss-recovery", "resilience"),
          ]
          write_json("packs/3d-immersive-web/component-manifest.json", {
              "name": "3D & Immersive Web Component Manifest",
              "version": "1.0.0",
              "components": [{
                  "id": identifier,
                  "category": category,
                  "requiredParts": ["accessible DOM counterpart when interactive", "status", "mobile behaviour", "fallback"],
                  "requiredStates": ["default", "loading", "interactive", "error", "reduced-motion", "fallback"],
                  "rule": "Do not make the canvas the only source of essential information or control.",
              } for identifier, category in component_rows],
          })

          interaction_rows = [
              ("pointer-parallax-object", "Subtle pointer response", "Static pose"),
              ("bounded-orbit-inspection", "Constrained product inspection", "Camera preset gallery"),
              ("camera-preset-navigation", "Move to labelled authored viewpoints", "Direct still views"),
              ("scroll-camera-path", "Synchronise camera with chapters", "DOM chapters"),
              ("chapter-snap", "Settle on authored story states", "Direct navigation"),
              ("object-hotspots", "Select labelled object points", "DOM hotspot list"),
              ("exploded-view", "Separate assemblies", "Exploded diagram"),
              ("section-cut", "Reveal interiors", "Section drawing"),
              ("material-switch", "Change verified material", "Variant photography"),
              ("environment-switch", "Preview context lighting", "Neutral render"),
              ("model-morph", "Transition between forms", "Before/after media"),
              ("image-to-3d-transition", "Connect DOM image and scene", "Direct page transition"),
              ("portal-navigation", "Preview and enter chapters", "Standard links"),
              ("guided-world-nodes", "Move among labelled stations", "Map/index"),
              ("first-person-navigation", "Optional free movement", "Guided nodes"),
              ("drag-throw-physics", "Tactile object physics", "Direct controls"),
              ("object-assembly", "Assemble parts", "Text steps"),
              ("timeline-scrub", "Scrub process or story", "Play/pause and chapters"),
              ("audio-reactive-scene", "Respond to opt-in audio", "Silent mode"),
              ("cursor-attraction-particles", "Pointer particle response", "Static field"),
              ("data-driven-particles", "Map verified data to points", "Table and legend"),
              ("globe-route-animation", "Animate verified routes", "2D map/list"),
              ("map-location-focus", "Synchronise list and map", "Location list"),
              ("character-state-machine", "Character reflects task state", "Text state and illustration"),
              ("skeletal-animation-control", "Play named animation clips", "Fallback video"),
              ("camera-look-at-focus", "Focus selected object", "Instant reduced-motion focus"),
              ("depth-hover-cards", "CSS/WebGL depth feedback", "Flat layout"),
              ("refraction-lens", "Decorative lens distortion", "Static render"),
              ("liquid-pointer-field", "Fluid pointer shader", "Video/still"),
              ("3d-text-extrusion", "Spatial display type", "DOM headline"),
              ("shared-canvas-sections", "One renderer across sections", "Static section renders"),
              ("multi-view-canvas", "Several views from one renderer", "Image grid"),
              ("progressive-model-streaming", "Coarse-to-detail model loading", "Data-first plan"),
              ("quality-auto-downgrade", "Reduce effects after sustained low FPS", "Lower tier"),
              ("context-loss-restore", "Recover graphics context", "Static fallback"),
              ("ar-place-object", "Place object in environment", "Viewer/photos"),
              ("xr-guided-tour", "Immersive checkpoints", "Non-XR tour"),
              ("scroll-annotation-sync", "Synchronise DOM annotation and scene", "Static annotation"),
              ("model-measurement", "Show verified dimensions", "Dimension table"),
          ]
          write_json("packs/3d-immersive-web/interaction-patterns.json", {
              "name": "3D & Immersive Web Interaction Patterns",
              "version": "1.0.0",
              "patterns": [{"id": identifier, "description": description, "bestFor": ["purpose-specific use"], "risks": "Performance, orientation or accessibility if overused", "fallback": fallback} for identifier, description, fallback in interaction_rows],
          })

          state_rows = [
              ("loading-shell", "system"), ("loading-scene", "loading"), ("downloading-assets", "loading"),
              ("decoding-model", "loading"), ("transcoding-textures", "loading"), ("compiling-shaders", "loading"),
              ("interactive", "ready"), ("paused", "system"), ("reduced-motion", "preference"),
              ("save-data", "preference"), ("low-power", "capability"), ("low-memory", "capability"),
              ("webgl-unavailable", "unsupported"), ("webgpu-unavailable", "unsupported"), ("context-lost", "resilience"),
              ("context-restoring", "resilience"), ("context-restored", "resilience"), ("scene-error", "error"),
              ("model-unavailable", "error"), ("texture-unavailable", "error"), ("shader-error", "error"),
              ("asset-licence-missing", "governance"), ("asset-credit-required", "governance"),
              ("quality-high", "quality"), ("quality-balanced", "quality"), ("quality-low", "quality"),
              ("fallback-static", "fallback"), ("fallback-video", "fallback"), ("fallback-2d-diagram", "fallback"),
              ("variant-changing", "configuration"), ("variant-unavailable", "configuration"), ("configuration-invalid", "configuration"),
              ("location-focused", "selection"), ("object-focused", "selection"), ("transitioning-camera", "motion"),
              ("xr-unsupported", "xr"), ("xr-permission-requested", "xr"), ("xr-permission-denied", "xr"),
              ("xr-session-active", "xr"), ("xr-session-error", "xr"), ("offline-static", "network"),
          ]
          write_json("packs/3d-immersive-web/state-vocabulary.json", {
              "name": "3D & Immersive Web State Vocabulary",
              "version": "1.0.0",
              "states": [{
                  "id": identifier,
                  "category": category,
                  "meaning": identifier.replace("-", " ").capitalize(),
                  "requiredUI": ["plain-language status", "impact", "recovery or fallback"],
                  "recoveryOrNext": "Preserve the primary task and move to a safe lower tier when needed.",
              } for identifier, category in state_rows],
          })

          budgets = {
              "name": "3D & Immersive Web Default Performance Budgets",
              "version": "1.0.0",
              "purpose": "Starting targets that require representative-device measurement and documented exceptions.",
              "principles": ["Semantic shell first", "Capability gate before heavy downloads", "One shared renderer where possible", "Measure sustained performance"],
              "tiers": [
                  {"id": "static", "targets": {"3dRuntimeBytesGzip": 0, "criticalMediaBytes": 900000}},
                  {"id": "basic-mobile", "targets": {"domShellJavaScriptGzipMax": 200000, "lazy3dRuntimeGzipMax": 350000, "critical3dAssetsMax": 1500000, "totalSceneTransferMax": 4000000, "visibleTrianglesMax": 150000, "drawCallsMax": 100, "maxTextureDimension": 2048, "estimatedGpuMemoryMBMax": 128, "targetFps": 30, "dprMax": 1.5}},
                  {"id": "balanced", "targets": {"domShellJavaScriptGzipMax": 220000, "lazy3dRuntimeGzipMax": 450000, "critical3dAssetsMax": 3000000, "totalSceneTransferMax": 10000000, "visibleTrianglesMax": 500000, "drawCallsMax": 200, "maxTextureDimension": 4096, "estimatedGpuMemoryMBMax": 256, "targetFps": 50, "dprMax": 2}},
                  {"id": "high", "targets": {"domShellJavaScriptGzipMax": 250000, "lazy3dRuntimeGzipMax": 550000, "critical3dAssetsMax": 5000000, "totalSceneTransferMax": 18000000, "visibleTrianglesMax": 1500000, "drawCallsMax": 350, "maxTextureDimension": 4096, "estimatedGpuMemoryMBMax": 512, "targetFps": 60, "dprMax": 2}},
              ],
              "globalTargets": {"shellFirstContentfulPaintSecondsOn4G": 2.5, "firstUseful3dFrameSecondsOn4G": 5.0, "inputLatencyMsTarget": 100, "contextRestoreAttemptsMax": 1, "pageHiddenRenderFps": 0},
              "exceptionRule": "Exceed a budget only with documented user benefit, measured coverage and an approved fallback.",
          }
          write_json("packs/3d-immersive-web/performance-budgets.json", budgets)

          # -----------------------------------------------------------------
          # Source and technique catalogues.
          # -----------------------------------------------------------------
          source_rows = [
              ("refs-gallery-3d", "Refs.Gallery — 3D category", "https://refs.gallery/category/3d", "reference-gallery", "reference-only"),
              ("awwwards-webgl", "Awwwards WebGL", "https://www.awwwards.com/websites/webgl/", "awards-gallery", "reference-only"),
              ("fwa", "The FWA", "https://thefwa.com/", "awards-gallery", "reference-only"),
              ("codrops-demos", "Codrops demos", "https://tympanus.net/codrops/demos/", "implementation-demo", "verify-per-demo"),
              ("threejs-examples", "Three.js examples", "https://threejs.org/examples/", "official-implementation", "official-project-terms"),
              ("threejs-docs", "Three.js documentation", "https://threejs.org/docs/", "official-documentation", "official-project-terms"),
