name: Extend 3D reference collection pipeline

on:
  push:
    branches:
      - feat/3d-immersive-web-pack
    paths:
      - .github/workflows/extend-3d-reference-pipeline.yml

permissions:
  contents: write

jobs:
  extend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/3d-immersive-web-pack
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Add reference schema, policy, seeds and normalizer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import textwrap
          from pathlib import Path

          root = Path('.')
          def write_text(relative: str, value: str) -> None:
              path = root / relative
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(textwrap.dedent(value).lstrip(), encoding='utf-8')

          def write_json(relative: str, value) -> None:
              path = root / relative
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(json.dumps(value, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          write_text('3d/REFERENCE_COLLECTION_POLICY.md', '''
          # 3D Reference Collection Policy

          ## Purpose

          The 3D reference library stores structured links and descriptive metadata so agents can compare styles, interaction patterns, implementation approaches and fallback strategies. It is not a mirror of another website or asset marketplace.

          ## What may be stored

          - Public source and project URLs.
          - Project title and a short original summary.
          - Public tags, date text and creator/studio name when clearly published.
          - Vault-authored style-family, interaction, performance, mobile and fallback classifications.
          - Licence posture such as `reference-only`, `verify-per-item`, `official-example` or `CC0-current-terms`.
          - Retrieval date, collection method and review status.

          ## What must not be stored without explicit rights

          - Copied screenshots or preview videos.
          - Website HTML, JavaScript, CSS or shader source.
          - Proprietary 3D models, textures, HDRIs, audio or font files.
          - Full copyrighted descriptions or marketing copy.
          - Credentials, private API responses or personal information.
          - Base64 media, data URLs, binary payloads or archived project files.

          ## Source classes

          1. `reference-gallery` — inspiration links only.
          2. `official-documentation` — implementation guidance under current project terms.
          3. `official-example` — technique example; verify repository/file licence.
          4. `community-demo` — verify the individual creator and licence.
          5. `template-marketplace` — purchase or platform terms required.
          6. `asset-library` — verify each asset even when a platform commonly uses CC0.
          7. `owner-provided` or `original` — record written permission or authorship.

          ## Collection workflow

          1. Add a source to `source-catalog.json` and `references/collection-seeds.json`.
          2. Collect only public links and minimal metadata, respecting source access controls and rate limits.
          3. Put raw metadata JSON—not media—under a temporary local import directory.
          4. Run `scripts/normalize-3d-reference-catalog.py`.
          5. Review deduplication, classification and current source terms.
          6. Commit only the normalized metadata catalogue and review notes.
          7. Revalidate periodically; websites, projects and licences can change.

          ## Originality rule

          References may influence principles such as camera pacing, information hierarchy, lighting attitude or fallback strategy. They may not be used to reproduce another project's branding, copy, models, media, proprietary code, exact composition or animation choreography.

          ## Removal and correction

          Remove or amend a record when its source disappears, licence posture is wrong, the link redirects to unsafe material, a rights holder requests removal or the record contains more than minimal descriptive metadata.
          ''')

          write_json('3d/reference-record.schema.json', {
              '$schema': 'https://json-schema.org/draft/2020-12/schema',
              '$id': 'https://example.invalid/ai-ui-style-vault/3d-reference-record.schema.json',
              'title': '3D Reference Record',
              'type': 'object',
              'additionalProperties': False,
              'required': ['id', 'title', 'sourceId', 'sourceType', 'projectPage', 'usagePolicy', 'retrievedAt'],
              'properties': {
                  'id': {'type': 'string', 'minLength': 1},
                  'title': {'type': 'string', 'minLength': 1, 'maxLength': 240},
                  'sourceId': {'type': 'string', 'minLength': 1},
                  'sourceType': {'type': 'string', 'enum': ['reference-gallery', 'awards-gallery', 'official-documentation', 'official-example', 'implementation-demo', 'community-demo', 'template-marketplace', 'asset-library', 'owner-provided', 'original']},
                  'projectPage': {'type': 'string', 'format': 'uri'},
                  'liveUrl': {'type': 'string'},
                  'creator': {'type': 'string', 'maxLength': 200},
                  'publishedText': {'type': 'string', 'maxLength': 120},
                  'description': {'type': 'string', 'maxLength': 500},
                  'tags': {'type': 'array', 'items': {'type': 'string', 'maxLength': 80}, 'uniqueItems': True},
                  'styleFamily': {'type': 'string'},
                  'interactionPatterns': {'type': 'array', 'items': {'type': 'string'}, 'uniqueItems': True},
                  'probableStack': {'type': 'array', 'items': {'type': 'string'}, 'uniqueItems': True},
                  'performanceRisk': {'type': 'string', 'enum': ['low', 'medium', 'high', 'very-high', 'unknown']},
                  'mobileStrategy': {'type': 'string', 'maxLength': 300},
                  'accessibilityFallback': {'type': 'string', 'maxLength': 300},
                  'usagePolicy': {'type': 'string', 'enum': ['reference-only', 'verify-per-example', 'verify-per-item', 'official-project-terms', 'owner-provided', 'original']},
                  'licencePosture': {'type': 'string', 'maxLength': 200},
                  'copyPolicy': {'type': 'string', 'maxLength': 300},
                  'retrievedAt': {'type': 'string'},
                  'reviewStatus': {'type': 'string', 'enum': ['unreviewed', 'metadata-reviewed', 'live-reviewed', 'retired']},
              },
          })

          seeds = [
              ('refs-gallery-3d', 'Refs.Gallery 3D', 'https://refs.gallery/category/3d', 'reference-gallery', ['3d', 'webgl', 'spatial', 'product']),
              ('awwwards-webgl', 'Awwwards WebGL', 'https://www.awwwards.com/websites/webgl/', 'awards-gallery', ['webgl', 'award', 'immersive']),
              ('awwwards-3d', 'Awwwards 3D', 'https://www.awwwards.com/websites/3d/', 'awards-gallery', ['3d', 'award']),
              ('fwa', 'The FWA', 'https://thefwa.com/', 'awards-gallery', ['immersive', 'campaign', 'experimental']),
              ('codrops-demos', 'Codrops Demos', 'https://tympanus.net/codrops/demos/', 'implementation-demo', ['webgl', 'shader', 'scroll', 'gallery']),
              ('codrops-webgl', 'Codrops WebGL articles', 'https://tympanus.net/codrops/tag/webgl/', 'implementation-demo', ['webgl', 'tutorial']),
              ('codrops-threejs', 'Codrops Three.js articles', 'https://tympanus.net/codrops/tag/three-js/', 'implementation-demo', ['three.js', 'tutorial']),
              ('three-examples', 'Three.js Examples', 'https://threejs.org/examples/', 'official-example', ['three.js', 'renderer', 'shader', 'xr']),
              ('three-manual', 'Three.js Manual', 'https://threejs.org/manual/', 'official-documentation', ['three.js', 'fundamentals']),
              ('r3f-examples', 'React Three Fiber Examples', 'https://r3f.docs.pmnd.rs/getting-started/examples', 'official-example', ['react', 'r3f', 'three.js']),
              ('drei', 'Drei Documentation', 'https://drei.docs.pmnd.rs/', 'official-documentation', ['r3f', 'components']),
              ('pmndrs-market', 'Pmndrs Market', 'https://market.pmnd.rs/', 'asset-library', ['r3f', 'models', 'materials']),
              ('babylon', 'Babylon.js', 'https://www.babylonjs.com/', 'official-documentation', ['babylon.js', 'webgpu', 'xr']),
              ('babylon-playground', 'Babylon.js Playground', 'https://playground.babylonjs.com/', 'official-example', ['babylon.js', 'playground']),
              ('theatre', 'Theatre.js', 'https://www.theatrejs.com/', 'official-documentation', ['timeline', 'camera', 'animation']),
              ('gsap-showcase', 'GSAP Showcase', 'https://gsap.com/showcase/', 'reference-gallery', ['gsap', 'scroll', 'animation']),
              ('spline-community', 'Spline Community', 'https://community.spline.design/', 'community-demo', ['spline', 'scene', 'interactive']),
              ('spline-examples', 'Spline Examples', 'https://spline.design/examples', 'official-example', ['spline', 'embed']),
              ('framer-3d', 'Framer 3D templates', 'https://www.framer.com/marketplace/templates/categories/3d/', 'template-marketplace', ['framer', 'template', '3d']),
              ('rive-community', 'Rive Community', 'https://rive.app/community/', 'community-demo', ['rive', 'state-machine', 'character']),
              ('model-viewer', 'model-viewer Examples', 'https://modelviewer.dev/examples/', 'official-example', ['gltf', 'product', 'ar']),
              ('gltf-samples', 'Khronos glTF Sample Assets', 'https://github.com/KhronosGroup/glTF-Sample-Assets', 'official-example', ['gltf', 'sample-assets']),
              ('webxr-samples', 'WebXR Samples', 'https://immersive-web.github.io/webxr-samples/', 'official-example', ['webxr', 'ar', 'vr']),
              ('webgpu-samples', 'WebGPU Samples', 'https://webgpu.github.io/webgpu-samples/', 'official-example', ['webgpu', 'compute', 'rendering']),
              ('polyhaven', 'Poly Haven', 'https://polyhaven.com/', 'asset-library', ['cc0', 'hdri', 'texture', 'model']),
              ('ambientcg', 'ambientCG', 'https://ambientcg.com/', 'asset-library', ['cc0', 'pbr', 'texture']),
              ('quaternius', 'Quaternius', 'https://quaternius.com/', 'asset-library', ['cc0', 'low-poly', 'model']),
              ('kenney', 'Kenney Assets', 'https://kenney.nl/assets', 'asset-library', ['game', 'low-poly', 'asset']),
              ('sketchfab', 'Sketchfab Downloadable Models', 'https://sketchfab.com/3d-models?features=downloadable', 'asset-library', ['models', 'per-item-licence']),
              ('blenderkit', 'BlenderKit', 'https://www.blenderkit.com/', 'asset-library', ['blender', 'models', 'materials']),
              ('mixamo', 'Adobe Mixamo', 'https://www.mixamo.com/', 'asset-library', ['character', 'animation']),
          ]
          write_json('3d/references/collection-seeds.json', {
              'name': '3D Reference Collection Seeds',
              'version': '1.0.0',
              'lastReviewed': '2026-08-15',
              'policy': '3d/REFERENCE_COLLECTION_POLICY.md',
              'seeds': [
                  {
                      'id': identifier,
                      'name': name,
                      'url': url,
                      'sourceType': source_type,
                      'tags': tags,
                      'collectionMode': 'links-and-minimal-public-metadata-only',
                      'licenceAction': 'verify current platform and individual project or asset terms before reuse',
                      'enabled': True,
                  }
                  for identifier, name, url, source_type, tags in seeds
              ],
          })

          write_json('3d/references/manual-import.example.json', {
              'sourceId': 'manual-curation',
              'retrievedAt': '2026-08-15T00:00:00Z',
              'records': [
                  {
                      'id': 'example-project',
                      'title': 'Example Immersive Project',
                      'sourceType': 'reference-gallery',
                      'projectPage': 'https://example.com/project-reference-page',
                      'liveUrl': 'https://example.com/live-project',
                      'creator': 'Replace with public creator information',
                      'description': 'Write a short original description; do not copy a full source description.',
                      'tags': ['3d', 'product'],
                      'styleFamily': 'photoreal-product-reveal',
                      'interactionPatterns': ['bounded-orbit-inspection'],
                      'probableStack': ['unknown'],
                      'performanceRisk': 'unknown',
                      'mobileStrategy': 'To be reviewed',
                      'accessibilityFallback': 'To be reviewed',
                      'usagePolicy': 'reference-only',
                      'licencePosture': 'Reference listing does not grant reuse rights.',
                      'copyPolicy': 'Do not copy code, media, branding, copy or exact composition.',
                      'reviewStatus': 'unreviewed',
                  }
              ],
          })

          write_json('3d/references/refresh-plan.json', {
              'name': '3D Reference Catalogue Refresh Plan',
              'version': '1.0.0',
              'cadence': {
                  'reference-galleries': 'quarterly',
                  'official-documentation-and-examples': 'every six months or before a major build',
                  'asset-licences': 'before every production use',
                  'broken-links': 'monthly when automation is available',
              },
              'qualityChecks': [
                  'deduplicate canonical URLs',
                  'reject binary or base64 content',
                  'preserve reference-only usage policy by default',
                  'flag redirects and unavailable projects',
                  'verify style and interaction classification manually',
                  'review current licence and attribution requirements',
              ],
              'ownership': 'The build agent or assigned library curator records reviewer and review date.',
          })

          write_text('scripts/normalize-3d-reference-catalog.py', r'''#!/usr/bin/env python3
          from __future__ import annotations

          import argparse
          import hashlib
          import json
          import re
          from pathlib import Path
          from urllib.parse import parse_qsl, urlencode, urlsplit, urlunsplit

          ROOT = Path(__file__).resolve().parents[1]
          FORBIDDEN_KEYS = {
              'html', 'sourceCode', 'code', 'css', 'javascript', 'shaderSource',
              'screenshot', 'screenshots', 'imageBase64', 'videoBase64', 'dataUrl',
              'binary', 'archive', 'modelFile', 'textureFile', 'mediaData',
          }
          ALLOWED_TYPES = {
              'reference-gallery', 'awards-gallery', 'official-documentation',
              'official-example', 'implementation-demo', 'community-demo',
              'template-marketplace', 'asset-library', 'owner-provided', 'original',
          }
          TRACKING_PREFIXES = ('utm_', 'fbclid', 'gclid', 'mc_')

          def canonical_url(value: str) -> str:
              parts = urlsplit(value.strip())
              if parts.scheme not in {'http', 'https'} or not parts.netloc:
                  raise ValueError(f'Invalid public URL: {value!r}')
              query = [(key, val) for key, val in parse_qsl(parts.query, keep_blank_values=True)
                       if not key.lower().startswith(TRACKING_PREFIXES)]
              path = re.sub(r'/+$', '', parts.path) or '/'
              return urlunsplit((parts.scheme.lower(), parts.netloc.lower(), path, urlencode(query), ''))

          def make_id(url: str) -> str:
              slug = re.sub(r'[^a-z0-9]+', '-', urlsplit(url).path.lower()).strip('-')[-80:]
              return slug or hashlib.sha1(url.encode()).hexdigest()[:12]

          def clean_text(value, limit):
              return re.sub(r'\s+', ' ', str(value or '')).strip()[:limit]

          def normalize(record: dict, source_id: str, retrieved_at: str) -> dict:
              forbidden = FORBIDDEN_KEYS.intersection(record)
              if forbidden:
                  raise ValueError(f'Forbidden copied-media/source fields: {sorted(forbidden)}')
              page = canonical_url(record.get('projectPage') or record.get('url') or record.get('href') or '')
              source_type = record.get('sourceType') or 'reference-gallery'
              if source_type not in ALLOWED_TYPES:
                  raise ValueError(f'Unsupported sourceType: {source_type}')
              usage = record.get('usagePolicy') or ('official-project-terms' if source_type == 'official-documentation' else 'reference-only')
              result = {
                  'id': clean_text(record.get('id') or make_id(page), 120),
                  'title': clean_text(record.get('title') or make_id(page).replace('-', ' ').title(), 240),
                  'sourceId': clean_text(record.get('sourceId') or source_id, 120),
                  'sourceType': source_type,
                  'projectPage': page,
                  'liveUrl': canonical_url(record['liveUrl']) if record.get('liveUrl') else '',
                  'creator': clean_text(record.get('creator'), 200),
                  'publishedText': clean_text(record.get('publishedText'), 120),
                  'description': clean_text(record.get('description'), 500),
                  'tags': sorted(set(clean_text(item, 80) for item in record.get('tags', []) if item)),
                  'styleFamily': clean_text(record.get('styleFamily') or 'mixed-dom-webgl', 120),
                  'interactionPatterns': sorted(set(clean_text(item, 120) for item in record.get('interactionPatterns', []) if item)),
                  'probableStack': sorted(set(clean_text(item, 80) for item in record.get('probableStack', []) if item)),
                  'performanceRisk': record.get('performanceRisk') or 'unknown',
                  'mobileStrategy': clean_text(record.get('mobileStrategy') or 'Requires review', 300),
                  'accessibilityFallback': clean_text(record.get('accessibilityFallback') or 'Requires review', 300),
                  'usagePolicy': usage,
                  'licencePosture': clean_text(record.get('licencePosture') or 'Verify current source and per-item terms.', 200),
                  'copyPolicy': clean_text(record.get('copyPolicy') or 'Do not copy code, media, branding, copy, models, textures or exact composition.', 300),
                  'retrievedAt': clean_text(record.get('retrievedAt') or retrieved_at, 80),
                  'reviewStatus': record.get('reviewStatus') or 'unreviewed',
              }
              if result['performanceRisk'] not in {'low', 'medium', 'high', 'very-high', 'unknown'}:
                  result['performanceRisk'] = 'unknown'
              return result

          def load_records(path: Path):
              payload = json.loads(path.read_text(encoding='utf-8'))
              if isinstance(payload, list):
                  return payload, path.stem, ''
              for key in ('records', 'references', 'projects', 'items', 'results'):
                  if isinstance(payload.get(key), list):
                      return payload[key], str(payload.get('sourceId') or payload.get('source') or path.stem), str(payload.get('retrievedAt') or '')
              raise ValueError(f'No records array in {path}')

          def main() -> int:
              parser = argparse.ArgumentParser(description='Normalize metadata-only 3D reference imports.')
              parser.add_argument('inputs', nargs='+')
              parser.add_argument('--output', default='3d/references/normalized-imports.json')
              args = parser.parse_args()

              by_url = {}
              errors = []
              for raw in args.inputs:
                  path = Path(raw)
                  try:
                      records, source_id, retrieved_at = load_records(path)
                      for index, record in enumerate(records):
                          try:
                              item = normalize(record, source_id, retrieved_at)
                              by_url[item['projectPage']] = item
                          except Exception as exc:
                              errors.append(f'{path}:{index}: {exc}')
                  except Exception as exc:
                      errors.append(f'{path}: {exc}')

              if errors:
                  print('REFERENCE_NORMALIZATION=FAIL')
                  for error in errors:
                      print(f'- {error}')
                  return 1

              output = Path(args.output)
              output.parent.mkdir(parents=True, exist_ok=True)
              payload = {
                  'name': 'Normalized 3D Reference Imports',
                  'usage': 'Metadata and links only. A reference is not a reuse licence.',
                  'total': len(by_url),
                  'references': sorted(by_url.values(), key=lambda item: (item['title'].lower(), item['projectPage'])),
              }
              output.write_text(json.dumps(payload, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
              print(f'REFERENCE_NORMALIZATION=PASS\nREFERENCES={len(by_url)}\nOUTPUT={output}')
              return 0

          if __name__ == '__main__':
              raise SystemExit(main())
          ''')

          write_text('tests/test_3d_reference_pipeline.py', r'''from __future__ import annotations
          import json
          import subprocess
          import sys
          import tempfile
          import unittest
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          SCRIPT = ROOT / 'scripts' / 'normalize-3d-reference-catalog.py'

          class ThreeDReferencePipelineTests(unittest.TestCase):
              def test_policy_schema_and_seeds_exist(self):
                  for relative in [
                      '3d/REFERENCE_COLLECTION_POLICY.md',
                      '3d/reference-record.schema.json',
                      '3d/references/collection-seeds.json',
                      '3d/references/manual-import.example.json',
                      '3d/references/refresh-plan.json',
                  ]:
                      self.assertTrue((ROOT / relative).is_file(), relative)
                  seeds = json.loads((ROOT / '3d/references/collection-seeds.json').read_text(encoding='utf-8'))
                  self.assertGreaterEqual(len(seeds['seeds']), 30)
                  self.assertTrue(any(item['id'] == 'refs-gallery-3d' for item in seeds['seeds']))

              def test_normalizer_deduplicates_and_removes_tracking(self):
                  with tempfile.TemporaryDirectory() as directory:
                      root = Path(directory)
                      source = root / 'source.json'
                      output = root / 'out.json'
                      source.write_text(json.dumps({
                          'sourceId': 'test',
                          'retrievedAt': '2026-08-15T00:00:00Z',
                          'records': [
                              {'title': 'A', 'projectPage': 'https://example.com/work/?utm_source=x', 'sourceType': 'reference-gallery'},
                              {'title': 'B', 'projectPage': 'https://example.com/work', 'sourceType': 'reference-gallery'},
                          ],
                      }), encoding='utf-8')
                      result = subprocess.run([sys.executable, str(SCRIPT), str(source), '--output', str(output)], cwd=ROOT, text=True, capture_output=True)
                      self.assertEqual(result.returncode, 0, result.stdout + result.stderr)
                      payload = json.loads(output.read_text(encoding='utf-8'))
                      self.assertEqual(payload['total'], 1)
                      self.assertEqual(payload['references'][0]['usagePolicy'], 'reference-only')

              def test_normalizer_rejects_copied_media_or_source(self):
                  with tempfile.TemporaryDirectory() as directory:
                      root = Path(directory)
                      source = root / 'bad.json'
                      source.write_text(json.dumps({'records': [{'projectPage': 'https://example.com/work', 'sourceCode': 'copied'}]}), encoding='utf-8')
                      result = subprocess.run([sys.executable, str(SCRIPT), str(source)], cwd=ROOT, text=True, capture_output=True)
                      self.assertNotEqual(result.returncode, 0)
                      self.assertIn('Forbidden copied-media/source fields', result.stdout)

          if __name__ == '__main__':
              unittest.main()
          ''')

          # Extend pack and indexes without replacing other packs.
          pack_path = root / 'packs/3d-immersive-web/pack.json'
          pack = json.loads(pack_path.read_text(encoding='utf-8'))
          additions = [
              '3d/REFERENCE_COLLECTION_POLICY.md',
              '3d/reference-record.schema.json',
              '3d/references/collection-seeds.json',
              '3d/references/refresh-plan.json',
          ]
          for value in additions:
              if value not in pack['requiredReads']:
                  pack['requiredReads'].append(value)
          pack['referenceNormalizerCommand'] = 'python scripts/normalize-3d-reference-catalog.py'
          write_json('packs/3d-immersive-web/pack.json', pack)

          index_path = root / 'packs/pack-index.json'
          index = json.loads(index_path.read_text(encoding='utf-8'))
          entry = next(item for item in index['packs'] if item['id'] == '3d-immersive-web')
          for value in additions:
              if value not in entry['requiredReads']:
                  entry['requiredReads'].append(value)
          entry['referenceNormalizerCommand'] = 'python scripts/normalize-3d-reference-catalog.py'
          write_json('packs/pack-index.json', index)

          agent_path = root / 'agent-index.json'
          agent = json.loads(agent_path.read_text(encoding='utf-8'))
          agent['entryPoints']['threeDReferencePolicy'] = '3d/REFERENCE_COLLECTION_POLICY.md'
          agent['entryPoints']['threeDReferenceSchema'] = '3d/reference-record.schema.json'
          agent['entryPoints']['threeDReferenceSeeds'] = '3d/references/collection-seeds.json'
          agent['entryPoints']['threeDReferenceNormalizer'] = 'scripts/normalize-3d-reference-catalog.py'
          agent['inventory']['threeDCollectionSeeds'] = len(seeds)
          write_json('agent-index.json', agent)

          readme_path = root / '3d/README.md'
          readme = readme_path.read_text(encoding='utf-8')
          if 'normalize-3d-reference-catalog.py' not in readme:
              readme += '''

          ## Metadata collection pipeline

          - Read `REFERENCE_COLLECTION_POLICY.md`.
          - Add or review sources in `references/collection-seeds.json`.
          - Put metadata-only imports in a temporary directory.
          - Run `python scripts/normalize-3d-reference-catalog.py <files...>`.
          - Review links, classifications and current terms before committing.

          The normalizer rejects copied source/media fields and defaults external references to `reference-only`.
          '''
              readme_path.write_text(textwrap.dedent(readme), encoding='utf-8')

          quality_path = root / '.github/workflows/quality.yml'
          quality = quality_path.read_text(encoding='utf-8')
          quality = quality.replace('scripts/validate-3d-immersive-pack.py scripts/select-3d-references.py', 'scripts/validate-3d-immersive-pack.py scripts/select-3d-references.py scripts/normalize-3d-reference-catalog.py')
          json_marker = '          python -m json.tool 3d/references/refs-gallery-collection-summary.json >/dev/null\n'
          if json_marker not in quality:
              raise RuntimeError('Quality JSON marker missing')
          quality = quality.replace(json_marker, json_marker + '          python -m json.tool 3d/reference-record.schema.json >/dev/null\n          python -m json.tool 3d/references/collection-seeds.json >/dev/null\n          python -m json.tool 3d/references/manual-import.example.json >/dev/null\n          python -m json.tool 3d/references/refresh-plan.json >/dev/null\n', 1)
          quality_path.write_text(quality, encoding='utf-8')
          PY

      - name: Validate complete library and pipeline
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/validate-content-design.py \
            scripts/initialize-vault-project.py \
            scripts/validate-domain-packs.py \
            scripts/validate-celebration-pack.py \
            scripts/validate-3d-immersive-pack.py \
            scripts/select-3d-references.py \
            scripts/normalize-3d-reference-catalog.py
          python -m unittest discover -s tests -p 'test_*.py' -v
          python scripts/validate-domain-packs.py
          python scripts/validate-celebration-pack.py
          python scripts/validate-3d-immersive-pack.py
          python scripts/normalize-3d-reference-catalog.py \
            3d/references/manual-import.example.json \
            --output /tmp/normalized-3d-references.json
          python - <<'PY'
          from pathlib import Path
          import json
          for path in Path('.').rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
          payload = json.loads(Path('/tmp/normalized-3d-references.json').read_text(encoding='utf-8'))
          assert payload['total'] == 1
          PY

      - name: Update validation report
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          report_path = Path('3d/VALIDATION_REPORT.md')
          report = report_path.read_text(encoding='utf-8') if report_path.exists() else '# 3D & Immersive Web Pack Validation Report\n\n'
          seeds = json.loads(Path('3d/references/collection-seeds.json').read_text(encoding='utf-8'))['seeds']
          section = f'''\n## Reference collection pipeline\n\n- Collection seed records: **{len(seeds)}**\n- Metadata schema: `3d/reference-record.schema.json`\n- Policy: `3d/REFERENCE_COLLECTION_POLICY.md`\n- Normalizer: `scripts/normalize-3d-reference-catalog.py`\n- The normalizer deduplicates canonical URLs, removes tracking parameters, constrains text length and rejects copied source/media fields.\n- External records default to `reference-only`; current source and per-item terms must still be checked manually.\n'''
          if '## Reference collection pipeline' not in report:
              report_path.write_text(report.rstrip() + '\n' + section, encoding='utf-8')
          PY

      - name: Commit pipeline and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/extend-3d-reference-pipeline.yml
          git add -- \
            3d/REFERENCE_COLLECTION_POLICY.md \
            3d/reference-record.schema.json \
            3d/references/collection-seeds.json \
            3d/references/manual-import.example.json \
            3d/references/refresh-plan.json \
            3d/README.md 3d/VALIDATION_REPORT.md \
            scripts/normalize-3d-reference-catalog.py \
            tests/test_3d_reference_pipeline.py \
            packs/3d-immersive-web/pack.json \
            packs/pack-index.json agent-index.json \
            .github/workflows/quality.yml \
            .github/workflows/extend-3d-reference-pipeline.yml
          git commit -m 'Add 3D reference collection and normalization pipeline'
          git push origin HEAD:feat/3d-immersive-web-pack
