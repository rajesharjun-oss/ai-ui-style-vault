name: Final cleanup for celebration feature

on:
  push:
    branches:
      - feat/celebration-event-microsite-pack
    paths:
      - .github/workflows/final-clean-celebration.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/celebration-event-microsite-pack
          fetch-depth: 0
      - name: Remove temporary workflow and payload files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin feat/celebration-event-microsite-pack
          git rm -f --ignore-unmatch \
            .github/tmp/celebration-pack/part-00 \
            .github/workflows/cleanup-celebration-branch.yml \
            .github/workflows/export-celebration-feature.yml \
            .github/workflows/final-clean-celebration.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Remove temporary celebration branch files"
          git push origin HEAD:feat/celebration-event-microsite-pack
