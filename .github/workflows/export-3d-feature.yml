name: Export 3D feature branch

on:
  push:
    branches:
      - feat/3d-immersive-web-pack
    paths:
      - .github/workflows/export-3d-feature.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/3d-immersive-web-pack
          fetch-depth: 1
      - name: Remove Git metadata
        run: rm -rf .git
      - name: Upload feature snapshot
        uses: actions/upload-artifact@v4
        with:
          name: three-d-feature-snapshot
          path: .
          include-hidden-files: true
          retention-days: 1
