name: Run final 3D pack materializer

on:
  push:
    branches:
      - feat/3d-immersive-web-pack
    paths:
      - .github/workflows/run-finalize-3d-pack.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/3d-immersive-web-pack
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Materialize 3D pack
        run: python scripts/finalize-3d-pack.py
      - name: Validate all domain packs
        run: |
          python scripts/validate-domain-packs.py
          python scripts/validate-celebration-pack.py
          python scripts/validate-3d-immersive-pack.py
      - name: Run tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Assert semantic relevance safeguards
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          path = Path('packs/3d-immersive-web/code/semantic-relevance.py')
          spec = importlib.util.spec_from_file_location('semantic_relevance', path)
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          assert mod.subject_relevance('pizza restaurant food delivery', 'red Ferrari sports car')['decision'] == 'reject'
          assert mod.subject_relevance('pizza restaurant food delivery', 'pepperoni pizza and oven')['decision'] == 'candidate'
          assert mod.subject_relevance('tax accounting consulting firm', 'luxury sports car')['decision'] == 'reject'
          assert mod.scene_relevance('pizza restaurant food delivery', {'product':'pepperoni pizza','environment':'luxury sports car showroom'})['decision'] == 'reject'
          assert mod.scene_relevance('pizza restaurant food delivery', {'product':'pepperoni pizza','environment':'restaurant interior','prop':'pizza oven'})['decision'] == 'candidate'
          print('SEMANTIC_RELEVANCE_HARD_GATE=PASS')
          PY
      - name: Commit actual library files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f --ignore-unmatch \
            .github/workflows/generate-3d-immersive-pack.yml \
            .github/workflows/extend-3d-reference-pipeline.yml \
            .github/workflows/verify-3d-immersive-pack.yml \
            .github/workflows/materialize-3d-pack.yml \
            .github/workflows/materialize-3d-pack-v2.yml \
            .github/workflows/patch-3d-relevance-matcher.yml \
            .github/workflows/export-3d-feature.yml \
            .github/workflows/finalize-3d-pack.yml \
            .github/workflows/run-finalize-3d-pack.yml \
            scripts/finalize-3d-pack.py
          git add -- AGENTS.md CLAUDE.md GEMINI.md PACKS.md PROMPTS.md README.md agent-index.json prompts packs 3d scripts tests .github/workflows/quality.yml
          git commit -m 'Materialize 3D immersive pack with strict semantic relevance'
          git push origin HEAD:feat/3d-immersive-web-pack
