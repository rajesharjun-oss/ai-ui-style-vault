name: Vault quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python tools
        run: python -m py_compile scripts/validate-content-design.py scripts/initialize-vault-project.py scripts/validate-domain-packs.py scripts/validate-celebration-pack.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Validate JSON documents
        run: |
          python -m json.tool agent-index.json >/dev/null
          python -m json.tool prompts/prompt-index.json >/dev/null
          python -m json.tool packs/pack-index.json >/dev/null
          python -m json.tool packs/fast-casual-commerce/pack.json >/dev/null
          python -m json.tool packs/fast-casual-commerce/production-theme.json >/dev/null
          python -m json.tool packs/fast-casual-commerce/page-blueprints.json >/dev/null
          python -m json.tool packs/fast-casual-commerce/component-manifest.json >/dev/null
          python -m json.tool packs/fast-casual-commerce/state-vocabulary.json >/dev/null
          python -m json.tool packs/fast-casual-commerce/sample-data/menu.sample.json >/dev/null
          python -m json.tool packs/fast-casual-commerce/schemas/menu.schema.json >/dev/null
          python -m json.tool packs/fast-casual-commerce/templates/design-recipe.example.json >/dev/null
          python -m json.tool packs/celebration-event-microsite/pack.json >/dev/null
          python -m json.tool packs/celebration-event-microsite/production-themes.json >/dev/null
          python -m json.tool packs/celebration-event-microsite/page-blueprints.json >/dev/null
          python -m json.tool packs/celebration-event-microsite/component-manifest.json >/dev/null
          python -m json.tool packs/celebration-event-microsite/state-vocabulary.json >/dev/null
          python -m json.tool packs/celebration-event-microsite/sample-data/wedding.sample.json >/dev/null
          python -m json.tool packs/celebration-event-microsite/schemas/couple-event.schema.json >/dev/null
          python -m json.tool packs/celebration-event-microsite/schemas/guest-rsvp.schema.json >/dev/null
          python -m json.tool packs/celebration-event-microsite/templates/design-recipe.example.json >/dev/null
          python -m json.tool quality/content-rules.json >/dev/null
          python -m json.tool quality/product-quality-gates.json >/dev/null
          python -m json.tool schemas/design-recipe.schema.json >/dev/null
          python -m json.tool system/component-manifest.json >/dev/null
          python -m json.tool system/motion-primitives.json >/dev/null
          python -m json.tool system/page-blueprints.json >/dev/null
          python -m json.tool system/production-theme-archetypes.json >/dev/null
          python -m json.tool templates/design-recipe.example.json >/dev/null
      - name: Validate Fast-Casual Commerce pack
        run: python scripts/validate-domain-packs.py
      - name: Validate Celebration & Event Microsite pack
        run: python scripts/validate-celebration-pack.py
      - name: Validate agent indexes and required files
        shell: pwsh
        run: ./scripts/validate-agent-guides.ps1
