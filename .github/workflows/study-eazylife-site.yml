name: Study Eazylife website pages

on:
  push:
    branches:
      - tmp/study-eazylife-site

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/eazylife-pages
          cd /tmp/eazylife-pages
          npm init -y >/dev/null
          npm install --silent playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture all public pages after scroll reveals
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/page-captures"
          mkdir -p "$OUT"
          cd /tmp/eazylife-pages
          OUT="$OUT" node <<'NODE'
          const { chromium } = require('playwright');
          const path = require('path');
          const fs = require('fs');
          const OUT = process.env.OUT;
          const BASE = 'https://eazylifewith.abbeyspace.com';
          const routes = [
            ['home', '/'],
            ['meet-the-couple', '/meet-the-couple'],
            ['our-story', '/our-story'],
            ['rsvp', '/rsvp'],
          ];
          const viewports = [
            ['desktop-1440x1000', { width: 1440, height: 1000 }],
            ['mobile-390x844', { width: 390, height: 844 }],
          ];
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function revealAll(page) {
            const height = await page.evaluate(() => document.documentElement.scrollHeight);
            for (let y = 0; y <= height; y += 520) {
              await page.evaluate((value) => window.scrollTo({ top: value, behavior: 'instant' }), y);
              await sleep(260);
            }
            await page.evaluate(() => window.scrollTo({ top: 0, behavior: 'instant' }));
            await sleep(1000);
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const report = [];
            try {
              for (const [viewportName, viewport] of viewports) {
                const context = await browser.newContext({ viewport, locale: 'en-GB', colorScheme: 'light' });
                for (const [routeName, route] of routes) {
                  const page = await context.newPage();
                  const errors = [];
                  page.on('pageerror', (error) => errors.push(String(error.message || error)));
                  const response = await page.goto(BASE + route, { waitUntil: 'domcontentloaded', timeout: 120000 });
                  await sleep(5000);
                  await revealAll(page);
                  await page.screenshot({ path: path.join(OUT, `${viewportName}-${routeName}-full.png`), fullPage: true });
                  await page.screenshot({ path: path.join(OUT, `${viewportName}-${routeName}-top.png`), fullPage: false });

                  if (routeName === 'home' && viewport.width < 600) {
                    const menu = page.locator('#mobile-menu-btn');
                    if (await menu.count()) {
                      await menu.click();
                      await sleep(400);
                      await page.screenshot({ path: path.join(OUT, `${viewportName}-mobile-menu.png`), fullPage: false });
                      await menu.click().catch(() => {});
                    }
                  }

                  if (routeName === 'home' && viewport.width >= 1000) {
                    const engagement = page.locator('.engagement-card').last();
                    if (await engagement.count()) {
                      await engagement.scrollIntoViewIfNeeded();
                      await engagement.click({ force: true });
                      await sleep(700);
                      await page.screenshot({ path: path.join(OUT, `${viewportName}-engagement-modal.png`), fullPage: false });
                      await page.evaluate(() => typeof closeEngagementModal === 'function' && closeEngagementModal());
                    }
                    const proposal = page.locator('.proposal-card').last();
                    if (await proposal.count()) {
                      await proposal.scrollIntoViewIfNeeded();
                      await proposal.click({ force: true });
                      await sleep(700);
                      await page.screenshot({ path: path.join(OUT, `${viewportName}-proposal-modal.png`), fullPage: false });
                      await page.evaluate(() => typeof closeProposalModal === 'function' && closeProposalModal());
                    }
                  }

                  report.push({
                    viewport: viewportName,
                    route: routeName,
                    status: response?.status() ?? null,
                    title: await page.title(),
                    finalUrl: page.url(),
                    height: await page.evaluate(() => document.documentElement.scrollHeight),
                    errors,
                  });
                  await page.close();
                }
                await context.close();
              }
            } finally {
              await browser.close();
            }
            fs.writeFileSync(path.join(OUT, 'capture-report.json'), JSON.stringify(report, null, 2), 'utf8');
          })().catch((error) => {
            fs.writeFileSync(path.join(OUT, 'fatal-error.txt'), String(error.stack || error), 'utf8');
            process.exitCode = 1;
          });
          NODE
      - name: Upload page captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eazylife-page-captures
          path: page-captures
          retention-days: 2
