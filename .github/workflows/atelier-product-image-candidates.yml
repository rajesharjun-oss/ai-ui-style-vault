name: Atelier product image candidates

on:
  push:
    branches:
      - tmp/atelier-product-image-candidates

permissions:
  contents: read

jobs:
  candidates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pillow requests
      - name: Download Wikimedia product-specific candidates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import io
          import json
          import time
          from pathlib import Path

          import requests
          from PIL import Image, ImageDraw, ImageFont, ImageOps
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          products = [
              ("arc-desk-lamp", "desk lamp"),
              ("drift-ceramic-vase", "ceramic vase"),
              ("halo-speaker", "wireless loudspeaker"),
              ("axis-watch", "wrist watch"),
              ("field-jacket", "field jacket clothing"),
              ("form-carryall", "leather tote bag"),
              ("fold-weekender", "duffel travel bag"),
              ("meridian-headphones", "over ear headphones"),
              ("orbit-tray", "leather valet tray"),
              ("studio-overshirt", "overshirt clothing"),
              ("fold-wallet", "leather wallet"),
              ("axis-stool", "wooden stool furniture"),
          ]

          root = Path("candidate-images")
          root.mkdir(parents=True, exist_ok=True)
          manifest: list[dict] = []

          session = requests.Session()
          retry = Retry(
              total=7,
              connect=4,
              read=4,
              status=7,
              backoff_factor=4,
              status_forcelist=(429, 500, 502, 503, 504),
              allowed_methods=frozenset(["GET"]),
              respect_retry_after_header=True,
          )
          session.mount("https://", HTTPAdapter(max_retries=retry))
          session.headers.update({
              "User-Agent": "AtelierNorthCandidateFetcher/1.1 (noncommercial product-image QA; GitHub Actions)",
              "Accept": "application/json,image/*;q=0.9,*/*;q=0.5",
          })

          def fetch_bytes(url: str) -> bytes:
              response = session.get(url, timeout=60)
              response.raise_for_status()
              return response.content

          def search(query: str) -> list[dict]:
              params = {
                  "action": "query",
                  "format": "json",
                  "formatversion": "2",
                  "generator": "search",
                  "gsrnamespace": "6",
                  "gsrsearch": f"{query} filetype:bitmap",
                  "gsrlimit": "16",
                  "prop": "imageinfo",
                  "iiprop": "url|mime|size|extmetadata",
                  "iiurlwidth": "900",
                  "maxlag": "5",
                  "origin": "*",
              }
              response = session.get("https://commons.wikimedia.org/w/api.php", params=params, timeout=60)
              response.raise_for_status()
              pages = response.json().get("query", {}).get("pages", [])
              output = []
              for page in pages:
                  info = (page.get("imageinfo") or [{}])[0]
                  mime = str(info.get("mime", ""))
                  thumb = info.get("thumburl") or info.get("url")
                  width = int(info.get("width") or 0)
                  height = int(info.get("height") or 0)
                  title = str(page.get("title", ""))
                  if not thumb or not mime.startswith("image/") or width < 350 or height < 350:
                      continue
                  lower = title.lower()
                  if any(token in lower for token in ("logo", "icon", "diagram", "map", "coat of arms", "flag", "drawing", "painting", "patent")):
                      continue
                  output.append({
                      "title": title,
                      "url": thumb,
                      "source_url": info.get("descriptionurl") or info.get("url"),
                      "width": width,
                      "height": height,
                      "mime": mime,
                  })
              return output

          max_candidates = 6
          for product_index, (slug, query) in enumerate(products):
              folder = root / slug
              folder.mkdir(parents=True, exist_ok=True)
              try:
                  candidates = search(query)
              except Exception as exc:
                  manifest.append({"slug": slug, "query": query, "error": f"search failed: {exc}"})
                  candidates = []
              saved = 0
              for item in candidates:
                  if saved >= max_candidates:
                      break
                  try:
                      image = Image.open(io.BytesIO(fetch_bytes(item["url"]))).convert("RGB")
                      ratio = image.width / max(image.height, 1)
                      if ratio > 2.4 or ratio < 0.35:
                          continue
                      saved += 1
                      path = folder / f"{saved}.jpg"
                      image.save(path, "JPEG", quality=90, optimize=True)
                      manifest.append({
                          "slug": slug,
                          "query": query,
                          "candidate": saved,
                          "path": str(path),
                          "download_url": item["url"],
                          **item,
                      })
                  except Exception as exc:
                      manifest.append({"slug": slug, "query": query, "title": item.get("title"), "error": str(exc)})
              # Respect Wikimedia request guidance and shared-runner rate limits.
              if product_index < len(products) - 1:
                  time.sleep(6)

          (root / "manifest.json").write_text(json.dumps(manifest, indent=2, ensure_ascii=False), encoding="utf-8")

          cell_w, cell_h = 220, 280
          label_h = 52
          cols = max_candidates
          sheet_w = cell_w * cols
          sheet_h = (cell_h + label_h) * len(products)
          sheet = Image.new("RGB", (sheet_w, sheet_h), "#f3efe7")
          draw = ImageDraw.Draw(sheet)
          font = ImageFont.load_default()

          for row, (slug, query) in enumerate(products):
              y0 = row * (cell_h + label_h)
              draw.rectangle((0, y0, sheet_w, y0 + label_h), fill="#1b1714")
              draw.text((10, y0 + 8), slug, fill="white", font=font)
              draw.text((10, y0 + 27), query, fill="#d7d0c4", font=font)
              for col in range(cols):
                  index = col + 1
                  x0 = col * cell_w
                  path = root / slug / f"{index}.jpg"
                  if path.exists():
                      image = Image.open(path).convert("RGB")
                      image = ImageOps.fit(image, (cell_w, cell_h), method=Image.Resampling.LANCZOS)
                      sheet.paste(image, (x0, y0 + label_h))
                  else:
                      draw.rectangle((x0, y0 + label_h, x0 + cell_w, y0 + label_h + cell_h), fill="#d7d0c4")
                  draw.rectangle((x0 + 7, y0 + label_h + 7, x0 + 36, y0 + label_h + 30), fill="white")
                  draw.text((x0 + 17, y0 + label_h + 13), str(index), fill="black", font=font)

          sheet.save(root / "contact-sheet.jpg", "JPEG", quality=88, optimize=True)
          PY

      - name: Upload candidates
        uses: actions/upload-artifact@v4
        with:
          name: atelier-product-image-candidates
          path: candidate-images
          retention-days: 1
