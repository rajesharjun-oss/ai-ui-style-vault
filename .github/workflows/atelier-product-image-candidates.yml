name: Atelier product image candidates

on:
  push:
    branches:
      - tmp/atelier-product-image-candidates

permissions:
  contents: read

jobs:
  candidates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Download product-specific candidate photographs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import io
          import json
          import time
          import urllib.request
          from pathlib import Path

          from PIL import Image, ImageDraw, ImageFont, ImageOps

          products = [
              ("arc-desk-lamp", "desk,lamp,interior"),
              ("drift-ceramic-vase", "ceramic,vase,decor"),
              ("halo-speaker", "wireless,speaker,audio"),
              ("axis-watch", "wristwatch,watch,product"),
              ("field-jacket", "field,jacket,fashion"),
              ("form-carryall", "tote,bag,leather"),
              ("fold-weekender", "weekender,duffel,bag"),
              ("meridian-headphones", "over-ear,headphones,audio"),
              ("orbit-tray", "leather,catchall,tray"),
              ("studio-overshirt", "overshirt,shirt,fashion"),
              ("fold-wallet", "leather,wallet,product"),
              ("axis-stool", "wooden,stool,furniture"),
          ]

          root = Path("candidate-images")
          root.mkdir(parents=True, exist_ok=True)
          manifest = []
          headers = {"User-Agent": "Mozilla/5.0 (compatible; AtelierCandidateFetcher/1.0)"}

          def fetch(url: str) -> bytes:
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=45) as response:
                  return response.read()

          for slug, tags in products:
              folder = root / slug
              folder.mkdir(parents=True, exist_ok=True)
              for lock in range(1, 7):
                  url = f"https://loremflickr.com/640/800/{tags}/all?lock={lock}"
                  try:
                      payload = fetch(url)
                      image = Image.open(io.BytesIO(payload)).convert("RGB")
                      path = folder / f"{lock}.jpg"
                      image.save(path, "JPEG", quality=90, optimize=True)
                      manifest.append({"slug": slug, "tags": tags, "lock": lock, "url": url, "path": str(path), "size": image.size})
                  except Exception as exc:
                      manifest.append({"slug": slug, "tags": tags, "lock": lock, "url": url, "error": str(exc)})
                  time.sleep(0.2)

          (root / "manifest.json").write_text(json.dumps(manifest, indent=2), encoding="utf-8")

          cell_w, cell_h = 220, 290
          label_h = 34
          sheet_w = cell_w * 6
          sheet_h = (cell_h + label_h) * len(products)
          sheet = Image.new("RGB", (sheet_w, sheet_h), "#f3efe7")
          draw = ImageDraw.Draw(sheet)
          font = ImageFont.load_default()

          for row, (slug, tags) in enumerate(products):
              y0 = row * (cell_h + label_h)
              draw.rectangle((0, y0, sheet_w, y0 + label_h), fill="#1b1714")
              draw.text((10, y0 + 10), f"{slug} | {tags}", fill="white", font=font)
              for col, lock in enumerate(range(1, 7)):
                  x0 = col * cell_w
                  path = root / slug / f"{lock}.jpg"
                  if path.exists():
                      image = Image.open(path).convert("RGB")
                      image = ImageOps.fit(image, (cell_w, cell_h), method=Image.Resampling.LANCZOS)
                      sheet.paste(image, (x0, y0 + label_h))
                  else:
                      draw.rectangle((x0, y0 + label_h, x0 + cell_w, y0 + label_h + cell_h), fill="#d7d0c4")
                  draw.rectangle((x0 + 8, y0 + label_h + 8, x0 + 38, y0 + label_h + 32), fill="white")
                  draw.text((x0 + 18, y0 + label_h + 15), str(lock), fill="black", font=font)

          sheet.save(root / "contact-sheet.jpg", "JPEG", quality=88, optimize=True)
          PY

      - name: Upload candidates
        uses: actions/upload-artifact@v4
        with:
          name: atelier-product-image-candidates
          path: candidate-images
          retention-days: 1
