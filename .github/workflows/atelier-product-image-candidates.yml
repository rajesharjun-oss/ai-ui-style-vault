name: Atelier product image candidates

on:
  push:
    branches:
      - tmp/atelier-product-image-candidates

permissions:
  contents: read

jobs:
  candidates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow requests
      - name: Download and normalize final stock photographs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import io
          import json
          from pathlib import Path

          import requests
          from PIL import Image, ImageOps

          root = Path("candidate-images")
          root.mkdir(parents=True, exist_ok=True)

          sources = [
              {
                  "slug": "fold-wallet",
                  "url": "https://images.pexels.com/photos/15763948/pexels-photo-15763948.jpeg?cs=srgb&fm=jpg&w=1800",
                  "sourcePage": "https://www.pexels.com/photo/brown-leather-wallet-on-white-back-15763948/",
                  "creator": "Josh Withers",
                  "license": "Pexels License",
              },
              {
                  "slug": "axis-stool",
                  "url": "https://images.unsplash.com/photo-1551907234-fb773fb08a2a?auto=format&fit=crop&fm=jpg&q=84&w=1800",
                  "sourcePage": "https://unsplash.com/photos/round-brown-wooden-stool-RvyJGaoaWrs",
                  "creator": "Goashape Studio",
                  "license": "Unsplash License",
              },
          ]

          session = requests.Session()
          session.headers.update({"User-Agent": "Mozilla/5.0 AtelierNorthDemo/1.0"})
          manifest = []

          for item in sources:
              response = session.get(item["url"], timeout=120)
              response.raise_for_status()
              image = Image.open(io.BytesIO(response.content)).convert("RGB")

              # Preserve the full product while normalizing every catalogue asset to 4:5.
              canvas = Image.new("RGB", (960, 1200), "#eee5d8")
              contained = ImageOps.contain(image, (900, 1120), method=Image.Resampling.LANCZOS)
              x = (canvas.width - contained.width) // 2
              y = (canvas.height - contained.height) // 2
              canvas.paste(contained, (x, y))
              path = root / f'{item["slug"]}.jpg'
              canvas.save(path, "JPEG", quality=90, optimize=True, progressive=True)
              manifest.append({**item, "localPath": str(path), "dimensions": [960, 1200]})

          (root / "manifest.json").write_text(json.dumps(manifest, indent=2), encoding="utf-8")
          PY
      - name: Upload final stock photographs
        uses: actions/upload-artifact@v4
        with:
          name: atelier-final-stock-product-images
          path: candidate-images
          retention-days: 1
