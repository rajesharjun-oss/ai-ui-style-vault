name: Atelier product image candidates

on:
  push:
    branches:
      - tmp/atelier-product-image-candidates

permissions:
  contents: read

jobs:
  candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pillow requests
      - name: Generate product-specific photographs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import io
          import json
          import urllib.parse
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path

          import requests
          from PIL import Image, ImageDraw, ImageFont, ImageOps

          products = [
              ("arc-desk-lamp", "a sculptural modern adjustable desk lamp in matte graphite metal, single product"),
              ("drift-ceramic-vase", "a hand-finished asymmetric ceramic vase in warm off-white stoneware, single product"),
              ("halo-speaker", "a premium compact wireless speaker with tactile fabric and minimal physical controls, single product"),
              ("axis-watch", "a restrained premium wristwatch with brushed steel case, clear dial and black leather strap, single product"),
              ("field-jacket", "an olive cotton field jacket displayed neatly on a minimal hanger, no person, single garment"),
              ("form-carryall", "a structured premium leather tote carryall bag in warm brown, single product"),
              ("fold-weekender", "a soft-sided premium charcoal weekender duffel travel bag, single product"),
              ("meridian-headphones", "premium over-ear wireless headphones in dark graphite, single product"),
              ("orbit-tray", "a shallow vegetable-tanned leather valet catchall tray holding one key, single product"),
              ("studio-overshirt", "a sand-coloured brushed cotton overshirt displayed neatly on a minimal hanger, no person, single garment"),
              ("fold-wallet", "a compact premium full-grain brown leather bifold wallet, single product"),
              ("axis-stool", "a compact modern wooden stool with a softened oak seat and black steel frame, single product"),
          ]

          root = Path("candidate-images")
          root.mkdir(parents=True, exist_ok=True)

          style = (
              "photorealistic premium ecommerce studio product photo, warm light beige seamless background, "
              "soft daylight from the left, subtle natural floor shadow, realistic material detail, "
              "single object centred, generous negative space, vertical product catalogue composition, "
              "no text, no logo, no watermark, no collage, no duplicate, no hands"
          )

          def generate(item: tuple[int, str, str]) -> dict:
              index, slug, subject = item
              prompt = f"{subject}; {style}"
              params = {
                  "width": "600",
                  "height": "750",
                  "seed": str(7100 + index * 113),
                  "model": "turbo",
                  "nologo": "true",
                  "enhance": "false",
                  "safe": "true",
              }
              url = "https://image.pollinations.ai/prompt/" + urllib.parse.quote(prompt, safe="") + "?" + urllib.parse.urlencode(params)
              headers = {
                  "User-Agent": "Mozilla/5.0 (compatible; AtelierNorthProductAssetBuilder/1.1)",
                  "Accept": "image/*,*/*;q=0.8",
              }
              try:
                  response = requests.get(url, headers=headers, timeout=(20, 150))
                  response.raise_for_status()
                  image = Image.open(io.BytesIO(response.content)).convert("RGB")
                  image = ImageOps.fit(image, (900, 1125), method=Image.Resampling.LANCZOS)
                  path = root / f"{slug}.jpg"
                  image.save(path, "JPEG", quality=91, optimize=True, progressive=True)
                  return {
                      "slug": slug,
                      "subject": subject,
                      "prompt": prompt,
                      "seed": params["seed"],
                      "source": "generated-concept",
                      "generator": "Pollinations image endpoint",
                      "path": str(path),
                      "size": image.size,
                  }
              except Exception as exc:
                  return {"slug": slug, "subject": subject, "error": str(exc), "url": url}

          indexed = [(index, slug, subject) for index, (slug, subject) in enumerate(products, start=1)]
          manifest: list[dict] = []
          with ThreadPoolExecutor(max_workers=4) as pool:
              futures = [pool.submit(generate, item) for item in indexed]
              for future in as_completed(futures):
                  manifest.append(future.result())

          manifest.sort(key=lambda item: [slug for slug, _ in products].index(item["slug"]))
          (root / "manifest.json").write_text(json.dumps(manifest, indent=2, ensure_ascii=False), encoding="utf-8")

          cell_w, cell_h = 240, 300
          label_h = 42
          cols = 4
          rows = 3
          sheet = Image.new("RGB", (cell_w * cols, (cell_h + label_h) * rows), "#f3efe7")
          draw = ImageDraw.Draw(sheet)
          font = ImageFont.load_default()

          for position, (slug, _) in enumerate(products):
              row, col = divmod(position, cols)
              x0 = col * cell_w
              y0 = row * (cell_h + label_h)
              path = root / f"{slug}.jpg"
              if path.exists():
                  image = Image.open(path).convert("RGB")
                  image = ImageOps.fit(image, (cell_w, cell_h), method=Image.Resampling.LANCZOS)
                  sheet.paste(image, (x0, y0))
              else:
                  draw.rectangle((x0, y0, x0 + cell_w, y0 + cell_h), fill="#d7d0c4")
              draw.rectangle((x0, y0 + cell_h, x0 + cell_w, y0 + cell_h + label_h), fill="#1b1714")
              draw.text((x0 + 8, y0 + cell_h + 14), slug, fill="white", font=font)

          sheet.save(root / "contact-sheet.jpg", "JPEG", quality=90, optimize=True)
          PY

      - name: Upload generated product assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atelier-product-image-candidates
          path: candidate-images
          retention-days: 1
