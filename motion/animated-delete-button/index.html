<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Animated Delete Button</title>
    <style>
      :root { color-scheme: light; --bg: #eef2ff; --button: #15182b; --ink: #fff; --muted: #8790ad; --danger: #ff4f6d; --ok: #51dc8b; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 28px; background: linear-gradient(135deg, #eef2ff, #f8f8ff); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      button { font: inherit; }
      .stage { width: min(720px, 94vw); min-height: 420px; display: grid; place-items: center; border-radius: 26px; background: #f9fbff; box-shadow: inset 0 0 0 1px rgba(67, 76, 111, .08), 0 30px 80px rgba(42, 52, 86, .12); }
      .delete-button { position: relative; min-width: 224px; min-height: 70px; display: inline-flex; align-items: center; justify-content: center; gap: 14px; border: 0; border-radius: 12px; color: var(--ink); background: var(--button); font-size: 20px; font-weight: 850; cursor: pointer; box-shadow: 0 18px 36px rgba(21, 24, 43, .28); overflow: hidden; transition: background 260ms ease, transform 260ms ease; }
      .delete-button:hover { transform: translateY(-2px); }
      .delete-button:focus-visible { outline: 3px solid rgba(21, 24, 43, .34); outline-offset: 5px; }
      .trash { position: relative; width: 32px; height: 34px; flex: 0 0 32px; }
      .trash .top { position: absolute; top: 1px; left: 6px; width: 20px; height: 6px; border: 3px solid currentColor; border-bottom: 0; border-radius: 4px 4px 0 0; transform-origin: 20% 100%; transition: transform 360ms cubic-bezier(.25,1,.5,1); }
      .trash .box { position: absolute; left: 5px; bottom: 1px; width: 22px; height: 24px; border: 3px solid currentColor; border-top: 0; border-radius: 0 0 5px 5px; transition: transform 360ms ease; }
      .trash .paper { position: absolute; left: 12px; top: -14px; width: 10px; height: 15px; border-radius: 2px; background: #fff; opacity: 0; transform: translateY(-12px) rotate(-12deg); }
      .check { position: absolute; width: 28px; height: 28px; left: 28px; opacity: 0; transform: scale(.72); color: var(--ok); }
      .check polyline { fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 18; stroke-dashoffset: 18; }
      .label { transition: transform 260ms ease, opacity 260ms ease; }
      .delete-button.is-deleting { background: #101426; pointer-events: none; }
      .delete-button.is-deleting .top { transform: rotate(-24deg) translate(-3px, -2px); }
      .delete-button.is-deleting .paper { animation: paper-drop 620ms cubic-bezier(.25,1,.5,1) forwards; }
      .delete-button.is-deleting .box { animation: bin-bounce 620ms cubic-bezier(.25,1,.5,1) forwards; }
      .delete-button.is-done { background: #10251a; }
      .delete-button.is-done .trash { opacity: 0; }
      .delete-button.is-done .check { opacity: 1; transform: scale(1); transition: opacity 220ms ease, transform 280ms cubic-bezier(.25,1,.5,1); }
      .delete-button.is-done .check polyline { animation: draw-check 420ms ease forwards; }
      .delete-button.is-done .label { transform: translateX(8px); }
      @keyframes paper-drop { 0% { opacity: 0; transform: translateY(-12px) rotate(-12deg); } 20% { opacity: 1; } 100% { opacity: 0; transform: translateY(28px) rotate(6deg); } }
      @keyframes bin-bounce { 0%, 100% { transform: translateY(0); } 45% { transform: translateY(4px) scaleY(.88); } }
      @keyframes draw-check { to { stroke-dashoffset: 0; } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; } }
    </style>
  </head>
  <body>
    <main class="stage" aria-label="Animated delete button preview">
      <button class="delete-button" type="button" aria-live="polite">
        <span class="trash" aria-hidden="true"><span class="top"></span><span class="paper"></span><span class="box"></span></span>
        <svg class="check" viewBox="0 0 24 24" aria-hidden="true"><polyline points="4 12.5 9.2 17.5 20 6.5"></polyline></svg>
        <span class="label">Delete Item</span>
      </button>
    </main>
    <script>
      const button = document.querySelector('.delete-button');
      const label = document.querySelector('.label');
      button.addEventListener('click', () => {
        if (button.classList.contains('is-deleting')) return;
        button.classList.add('is-deleting');
        label.textContent = 'Deleting';
        setTimeout(() => { button.classList.remove('is-deleting'); button.classList.add('is-done'); label.textContent = 'Deleted'; }, 760);
        setTimeout(() => { button.classList.remove('is-done'); label.textContent = 'Delete Item'; }, 2100);
      });
    </script>
  </body>
</html>
