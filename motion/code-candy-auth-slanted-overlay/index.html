<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Code Candy Auth Slanted Overlay</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #070711;
        --panel: #0b0b15;
        --panel-soft: #151522;
        --ink: #f8f9ff;
        --muted: #a7adc2;
        --pink: #ff2fa8;
        --violet: #8a4fff;
        --blue: #2f8cff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: clamp(18px, 5vw, 56px);
        background:
          radial-gradient(circle at 50% 12%, rgba(138, 79, 255, 0.34), transparent 34%),
          linear-gradient(180deg, #050612, #090516 64%, #05040c);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      button, input { font: inherit; }
      .auth-container {
        position: relative;
        width: min(980px, 100%);
        min-height: 520px;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.11);
        border-radius: 18px;
        background: var(--panel);
        box-shadow: 0 0 44px rgba(138, 79, 255, 0.36), 0 30px 90px rgba(0, 0, 0, 0.58);
      }
      .form-panel {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 14px;
        min-width: 0;
        padding: clamp(28px, 5vw, 54px);
        background: #090913;
        transition:
          opacity 900ms cubic-bezier(.77, 0, .18, 1),
          transform 900ms cubic-bezier(.77, 0, .18, 1),
          filter 900ms cubic-bezier(.77, 0, .18, 1);
      }
      .form-panel--signup {
        opacity: 0;
        transform: translateX(80px);
        filter: blur(6px);
        pointer-events: none;
      }
      .auth-container.active .form-panel--login {
        opacity: 0;
        transform: translateX(-80px);
        filter: blur(6px);
        pointer-events: none;
      }
      .auth-container.active .form-panel--signup {
        opacity: 1;
        transform: translateX(0);
        filter: blur(0);
        pointer-events: auto;
      }
      .kicker {
        margin: 0;
        color: var(--pink);
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 0;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-size: clamp(36px, 6vw, 58px);
        line-height: 0.95;
        letter-spacing: 0;
      }
      p {
        margin: 0 0 8px;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.5;
      }
      label {
        display: grid;
        gap: 7px;
        color: #cbd0e0;
        font-size: 13px;
        font-weight: 800;
      }
      input {
        width: 100%;
        min-height: 52px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.06);
        color: var(--ink);
        padding: 0 15px;
        outline: none;
      }
      input:focus-visible { border-color: rgba(255, 47, 168, 0.7); box-shadow: 0 0 0 4px rgba(255, 47, 168, 0.12); }
      .cta {
        min-height: 52px;
        border: 0;
        border-radius: 10px;
        color: #fff;
        font-weight: 900;
        background: linear-gradient(90deg, #8a2cff, #ff2fa8);
        box-shadow: 0 16px 34px rgba(255, 47, 168, 0.28);
        cursor: pointer;
      }
      .overlay-panel {
        position: absolute;
        inset: 0 0 0 50%;
        z-index: 2;
        display: grid;
        place-items: center;
        padding: clamp(28px, 5vw, 56px);
        clip-path: polygon(14% 0, 100% 0, 100% 100%, 0 100%);
        background: linear-gradient(135deg, var(--blue), var(--violet) 50%, var(--pink));
        text-align: center;
        transition:
          transform 900ms cubic-bezier(.77, 0, .18, 1),
          clip-path 900ms cubic-bezier(.77, 0, .18, 1);
      }
      .auth-container.active .overlay-panel {
        transform: translateX(-100%);
        clip-path: polygon(0 0, 86% 0, 100% 100%, 0 100%);
      }
      .overlay-copy {
        grid-area: 1 / 1;
        max-width: 300px;
        transition:
          opacity 600ms cubic-bezier(.77, 0, .18, 1),
          transform 600ms cubic-bezier(.77, 0, .18, 1);
      }
      .overlay-copy--signin {
        opacity: 0;
        transform: translateX(24px);
        pointer-events: none;
      }
      .auth-container.active .overlay-copy--signup {
        opacity: 0;
        transform: translateX(-24px);
        pointer-events: none;
      }
      .auth-container.active .overlay-copy--signin {
        opacity: 1;
        transform: translateX(0);
        pointer-events: auto;
      }
      .outline-btn {
        min-width: 150px;
        min-height: 46px;
        margin-top: 14px;
        border: 1px solid rgba(255, 255, 255, 0.45);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
        font-weight: 900;
        cursor: pointer;
      }
      .outline-btn:hover,
      .outline-btn:focus-visible { background: rgba(255, 255, 255, 0.2); outline: none; }
      .orbit-dots {
        position: absolute;
        top: 34px;
        right: 62px;
        width: 84px;
        aspect-ratio: 1;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 50%;
        animation: spin 5s linear infinite;
        pointer-events: none;
      }
      .orbit-dots::before,
      .orbit-dots::after {
        content: "";
        position: absolute;
        width: 8px;
        aspect-ratio: 1;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 0 12px #fff;
      }
      .orbit-dots::before { left: 12px; top: 19px; }
      .orbit-dots::after { right: 16px; bottom: 15px; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (max-width: 760px) {
        .auth-container { grid-template-columns: 1fr; min-height: 760px; }
        .form-panel { min-height: 380px; }
        .overlay-panel {
          inset: auto 0 0 0;
          height: 50%;
          clip-path: polygon(0 10%, 100% 0, 100% 100%, 0 100%);
        }
        .auth-container.active .overlay-panel {
          transform: translateY(-100%);
          clip-path: polygon(0 0, 100% 0, 100% 90%, 0 100%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }
      }
    </style>
  </head>
  <body>
    <main class="auth-container" id="authOne">
      <section class="form-panel form-panel--login" aria-label="Sign in form">
        <p class="kicker">Welcome back</p>
        <h1>Sign in</h1>
        <p>Enter your details to continue.</p>
        <label>Email<input autocomplete="email" placeholder="you@example.com" type="email" /></label>
        <label>Password<input autocomplete="current-password" placeholder="Password" type="password" /></label>
        <button class="cta" type="button">Sign in</button>
      </section>
      <section class="form-panel form-panel--signup" aria-label="Create account form">
        <p class="kicker">Start fresh</p>
        <h1>Create account</h1>
        <p>Join in with a few quick details.</p>
        <label>Full name<input autocomplete="name" placeholder="Full name" /></label>
        <label>Email<input autocomplete="email" placeholder="email address" type="email" /></label>
        <label>Password<input autocomplete="new-password" placeholder="Password" type="password" /></label>
        <button class="cta" type="button">Create account</button>
      </section>
      <div class="overlay-panel" aria-hidden="false">
        <div class="orbit-dots"></div>
        <div class="overlay-copy overlay-copy--signup">
          <h1>New around here?</h1>
          <p>Create an account and unlock the full experience.</p>
          <button class="outline-btn" type="button" data-mode="signup">Create account</button>
        </div>
        <div class="overlay-copy overlay-copy--signin">
          <h1>Already have an account?</h1>
          <p>Return to the sign-in form.</p>
          <button class="outline-btn" type="button" data-mode="signin">Sign in</button>
        </div>
      </div>
    </main>
    <script>
      const auth = document.querySelector('#authOne');
      const buttons = [...document.querySelectorAll('[data-mode]')];
      function setMode(mode) {
        const signup = mode === 'signup';
        auth.classList.toggle('active', signup);
        buttons.forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.mode === mode)));
      }
      buttons.forEach((button) => button.addEventListener('click', () => setMode(button.dataset.mode)));
      const requested = new URLSearchParams(window.location.search).get('mode');
      if (requested === 'signup' || requested === 'signin') setMode(requested);
    </script>
  </body>
</html>
