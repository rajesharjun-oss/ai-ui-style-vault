<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Code Candy Hover Pill Menu</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #052532;
        --ink: #ffffff;
        --muted: rgba(255, 255, 255, 0.62);
        --cyan: #00e5ff;
        --teal: #00c8d7;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 28px;
        background:
          radial-gradient(circle at 50% 48%, rgba(0, 229, 255, 0.26), transparent 42%),
          linear-gradient(180deg, #063847, #041923 72%);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      button { font: inherit; }
      .menu-shell {
        display: grid;
        place-items: center;
        width: min(840px, 100%);
        min-height: 360px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 8px;
        background: rgba(5, 22, 31, 0.58);
        box-shadow: 0 34px 110px rgba(0, 0, 0, 0.35);
      }
      .expanding-menu {
        height: 92px;
        display: flex;
        align-items: center;
        gap: 0.75rem;
        max-width: calc(100vw - 56px);
        padding: 18px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(0, 196, 206, 0.5);
        box-shadow: 0 0 42px rgba(0, 229, 255, 0.28), inset 0 1px rgba(255, 255, 255, 0.18);
        backdrop-filter: blur(16px);
      }
      .menu-item {
        width: 52px;
        height: 52px;
        display: flex;
        flex: 0 0 auto;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        overflow: hidden;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        transition:
          width .45s cubic-bezier(.22, 1, .36, 1),
          background .3s ease,
          box-shadow .3s ease,
          color .3s ease;
      }
      .menu-item svg {
        width: 28px;
        height: 28px;
        flex: 0 0 auto;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.9;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .menu-label {
        max-width: 0;
        opacity: 0;
        transform: translateX(-8px);
        overflow: hidden;
        white-space: nowrap;
        font-size: 14px;
        font-weight: 850;
        transition: opacity .25s ease, max-width .45s ease, transform .35s ease;
      }
      .menu-item:hover,
      .menu-item:focus-visible {
        width: 160px;
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
        box-shadow: 0 0 28px rgba(0, 229, 255, 0.22);
        outline: none;
      }
      .menu-item:hover .menu-label,
      .menu-item:focus-visible .menu-label {
        max-width: 100px;
        opacity: 1;
        transform: translateX(0);
      }
      @media (max-width: 560px) {
        .expanding-menu { gap: 0.35rem; padding: 12px; height: 76px; }
        .menu-item { width: 46px; height: 46px; }
        .menu-item:hover,
        .menu-item:focus-visible { width: 128px; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { transition-duration: 1ms !important; }
      }
    </style>
  </head>
  <body>
    <main class="menu-shell">
      <nav class="expanding-menu" aria-label="Hover menu">
        <button class="menu-item" type="button" aria-label="Apps">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg>
          <span class="menu-label">Apps</span>
        </button>
        <button class="menu-item" type="button" aria-label="Files">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h7l2 2h9v10H3z"/></svg>
          <span class="menu-label">Files</span>
        </button>
        <button class="menu-item" type="button" aria-label="Chat">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14v11H8l-3 3z"/></svg>
          <span class="menu-label">Chat</span>
        </button>
        <button class="menu-item" type="button" aria-label="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 100 8 4 4 0 000-8zM12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
          <span class="menu-label">Settings</span>
        </button>
        <button class="menu-item" type="button" aria-label="Exit">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17l5-5-5-5M15 12H3M21 4v16"/></svg>
          <span class="menu-label">Exit</span>
        </button>
      </nav>
    </main>
  </body>
</html>
